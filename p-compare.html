<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เปรียบเทียบจี้เครื่องราง V.2</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #eff6ff;
      --match-bg: #f0fdf4;
      --match-border: #bbf7d0;
      --diff-header-bg: #f1f5f9;
      --growth-bg: #fef3c7;
      --growth-text: #92400e;
      --dark-theme: #334155;
      --white-theme: #0284c7;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.98rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .is-hidden {
      display: none !important;
    }

    /* แถบ Loading แบบไฟเต็มหลอด */
    .loading-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .loading-card.done {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .loading-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .loading-percent {
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .loading-track {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background-color: #e2e8f0;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    .loading-fill {
      position: relative;
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb 0%, #38bdf8 60%, #60a5fa 100%);
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.55);
      transition: width 0.22s ease-out, box-shadow 0.25s ease;
    }

    .loading-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmerSweep 1.15s infinite;
    }

    .loading-fill.full {
      background: linear-gradient(90deg, #16a34a 0%, #22c55e 65%, #4ade80 100%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.75);
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .control-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .slot-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.94rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-btn {
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .search-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      z-index: 30;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.show {
      display: block;
    }

    .suggestion-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--accent);
    }

    .suggestion-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .suggestion-sub {
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-empty {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .select-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 11px 12px;
      font-size: 0.98rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      cursor: pointer;
    }

    .clear-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .clear-btn:hover:not(:disabled) {
      background-color: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    .clear-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: #f8fafc;
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .compare-table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .compare-table th,
    .compare-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.45;
      font-size: 0.88rem;
      word-wrap: break-word;
    }

    .compare-table th.pendant-head {
      background-color: var(--accent);
      color: var(--primary);
      font-size: 0.98rem;
      font-weight: 700;
      text-align: center;
      padding: 14px 10px;
      border-bottom: 2px solid #bfdbfe;
    }

    .compare-table th.pendant-head.slot-1 {
      border-right: 2px solid #cbd5e1;
    }

    .head-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .head-title {
      line-height: 1.35;
    }

    .head-thumb {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #bfdbfe;
      padding: 4px;
      flex-shrink: 0;
    }

    .head-thumb-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      color: var(--muted);
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .variant-tabs {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2px;
    }

    .variant-btn {
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background-color: #fff;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }

    .variant-btn:hover {
      background-color: #f8fafc;
    }

    .variant-btn.active[data-variant="normal"] {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .variant-btn.active[data-variant="dark"] {
      background-color: var(--dark-theme);
      border-color: var(--dark-theme);
      color: #fff;
    }

    .variant-btn.active[data-variant="white"] {
      background-color: var(--white-theme);
      border-color: var(--white-theme);
      color: #fff;
    }

    .variant-btn.no-data {
      opacity: 0.45;
    }

    .compare-table th.sub-col-head {
      background-color: #f8fafc;
      color: #334155;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      padding: 8px 6px;
      border-bottom: 1px solid #cbd5e1;
    }

    .compare-table th.sub-col-head.col-skill {
      text-align: left;
      padding-left: 10px;
    }

    .compare-table th.sub-col-head.slot-1-end,
    .compare-table td.slot-1-end {
      border-right: 2px solid #cbd5e1;
    }

    .compare-table td.col-skill {
      text-align: left;
    }

    .compare-table td.col-percent,
    .compare-table td.col-growth {
      text-align: center;
    }

    .compare-table tr.matched-row td {
      background-color: var(--match-bg);
    }

    .compare-table tr.diff-section-row td {
      background-color: var(--diff-header-bg);
      color: #334155;
      font-weight: 700;
      text-align: center;
      font-size: 0.9rem;
      padding: 9px;
      border-top: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
    }

    .skill-slot-tag {
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
      font-size: 0.85em;
    }

    .percent-badge {
      display: inline-block;
      background-color: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .matched-row .percent-badge {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid var(--match-border);
    }

    .percent-none {
      background-color: #f1f5f9 !important;
      color: var(--muted) !important;
      border-color: transparent !important;
    }

    .growth-badge {
      display: inline-block;
      background-color: var(--growth-bg);
      color: var(--growth-text);
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .growth-empty {
      background-color: #f1f5f9;
      color: var(--muted);
    }

    .empty-cell-dash {
      color: #cbd5e1;
      text-align: center;
      display: block;
      font-size: 0.88rem;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 32px 16px;
      font-size: 0.95rem;
    }

    .error-box {
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .controls-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 1.25rem;
      }

      p.subtitle {
        font-size: 0.85rem;
        margin-bottom: 14px;
      }

      .loading-card {
        padding: 14px 12px;
        border-radius: 10px;
      }

      .loading-top {
        font-size: 0.84rem;
      }

      .loading-track {
        height: 11px;
      }

      .controls-grid {
        gap: 12px;
        margin-bottom: 18px;
      }

      .control-card {
        padding: 12px 14px;
        border-radius: 10px;
      }

      .slot-label {
        font-size: 0.8rem;
      }

      .search-wrapper {
        margin-bottom: 8px;
      }

      .search-row {
        gap: 6px;
      }

      .search-input {
        padding: 8px 10px;
        font-size: 0.84rem;
      }

      .search-btn {
        padding: 8px 11px;
        font-size: 0.8rem;
      }

      .suggestion-name {
        font-size: 0.82rem;
      }

      .suggestion-sub {
        font-size: 0.7rem;
      }

      .suggestion-empty {
        font-size: 0.78rem;
      }

      .select-row {
        gap: 8px;
      }

      select {
        padding: 9px 10px;
        font-size: 0.86rem;
      }

      .clear-btn {
        width: 38px;
        height: 38px;
        font-size: 0.92rem;
      }

      .table-card {
        border-radius: 10px;
      }

      .compare-table {
        min-width: 680px;
      }

      .compare-table th,
      .compare-table td {
        padding: 7px 5px;
        font-size: 0.74rem;
        line-height: 1.4;
      }

      .compare-table th.pendant-head {
        font-size: 0.82rem;
        padding: 10px 6px;
      }

      .head-thumb,
      .head-thumb-placeholder {
        width: 48px;
        height: 48px;
        border-radius: 8px;
      }

      .variant-btn {
        padding: 4px 8px;
        font-size: 0.72rem;
      }

      .percent-badge,
      .growth-badge {
        padding: 2px 6px;
        font-size: 0.68rem;
      }

      .empty-state {
        padding: 22px 10px;
        font-size: 0.82rem;
      }

      .error-box {
        padding: 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>เปรียบเทียบจี้เครื่องราง V.2</h1>
  <p class="subtitle">ค้นหาหรือเลือกจี้เครื่องราง 2 ชิ้น เลือกโหมด Normal / [ดาร์ค] / [ไวท์] และเปรียบเทียบสกิล เปอร์เซ็นต์ และการเติบโต</p>

  <div id="globalError"></div>
  <div id="loadingArea"></div>

  <div id="mainContent" class="is-hidden">
    <div class="controls-grid">
      <!-- จี้เครื่องรางชิ้นที่ 1 -->
      <div class="control-card">
        <div class="slot-label">จี้เครื่องรางชิ้นที่ 1</div>

        <div class="search-wrapper" data-slot="1">
          <div class="search-row">
            <input
              id="searchInput1"
              class="search-input"
              type="text"
              placeholder="พิมพ์ชื่อจี้ หรือคำในความสามารถ..."
              autocomplete="off"
              oninput="renderSuggestions(1)"
              onfocus="renderSuggestions(1)"
              onkeydown="handleSearchKeydown(event, 1)"
            />
            <button
              id="searchBtn1"
              class="search-btn"
              type="button"
              onclick="triggerSearch(1)"
            >Search</button>
          </div>
          <div id="suggestionsBox1" class="suggestions-box"></div>
        </div>

        <div class="select-row">
          <select id="pendantSelect1" onchange="onSelectChange(1)"></select>
          <button
            id="clearBtn1"
            class="clear-btn"
            type="button"
            title="ล้างค่าจี้ชิ้นที่ 1"
            aria-label="ล้างค่าจี้ชิ้นที่ 1"
            onclick="clearSlot(1)"
            disabled
          >✕</button>
        </div>
      </div>

      <!-- จี้เครื่องรางชิ้นที่ 2 -->
      <div class="control-card">
        <div class="slot-label">จี้เครื่องรางชิ้นที่ 2</div>

        <div class="search-wrapper" data-slot="2">
          <div class="search-row">
            <input
              id="searchInput2"
              class="search-input"
              type="text"
              placeholder="พิมพ์ชื่อจี้ หรือคำในความสามารถ..."
              autocomplete="off"
              oninput="renderSuggestions(2)"
              onfocus="renderSuggestions(2)"
              onkeydown="handleSearchKeydown(event, 2)"
            />
            <button
              id="searchBtn2"
              class="search-btn"
              type="button"
              onclick="triggerSearch(2)"
            >Search</button>
          </div>
          <div id="suggestionsBox2" class="suggestions-box"></div>
        </div>

        <div class="select-row">
          <select id="pendantSelect2" onchange="onSelectChange(2)"></select>
          <button
            id="clearBtn2"
            class="clear-btn"
            type="button"
            title="ล้างค่าจี้ชิ้นที่ 2"
            aria-label="ล้างค่าจี้ชิ้นที่ 2"
            onclick="clearSlot(2)"
            disabled
          >✕</button>
        </div>
      </div>
    </div>

    <div class="table-card" id="comparisonTableContainer">
      <div class="empty-state">กรุณาเลือกจี้เครื่องรางอย่างน้อย 1 ชิ้นเพื่อดูข้อมูล</div>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4fmF9t573ywsirLCRnaQZZqUsPFxeSMX8oH2fhz9E6OtiIlC46LumfuRYLsxfTEOldw/exec";
  const VARIANT_ORDER = ["normal", "dark", "white"];
  const VARIANT_LABELS = {
    normal: "Normal",
    dark: "[ดาร์ค]",
    white: "[ไวท์]"
  };

  let pendantDatabase = [];
  const activeVariants = {
    1: "normal",
    2: "normal"
  };

  let loadingTimer = null;
  let currentProgress = 0;

  function setMainContentVisible(visible) {
    const mainContent = document.getElementById("mainContent");
    if (!mainContent) return;
    if (visible) {
      mainContent.classList.remove("is-hidden");
    } else {
      mainContent.classList.add("is-hidden");
    }
  }

  function startLoadingBar() {
    const loadingArea = document.getElementById("loadingArea");
    stopLoadingBar();
    currentProgress = 12;
    setMainContentVisible(false);

    loadingArea.innerHTML = `
      <div id="loadingCard" class="loading-card">
        <div class="loading-top">
          <span id="loadingStatusText">Loading</span>
          <span id="loadingPercentText" class="loading-percent">12%</span>
        </div>
        <div class="loading-track">
          <div id="loadingFillBar" class="loading-fill" style="width: 12%;"></div>
        </div>
      </div>
    `;

    loadingTimer = setInterval(() => {
      if (currentProgress < 90) {
        const step = currentProgress < 50 ? 7 : currentProgress < 75 ? 4 : 2;
        currentProgress = Math.min(90, currentProgress + step);
        updateLoadingBarVisual(currentProgress, "Loading", false);
      }
    }, 220);
  }

  function updateLoadingBarVisual(pct, statusText, isFull) {
    const fill = document.getElementById("loadingFillBar");
    const pctText = document.getElementById("loadingPercentText");
    const labelText = document.getElementById("loadingStatusText");
    if (!fill || !pctText || !labelText) return;

    const clamped = Math.max(0, Math.min(100, Math.round(pct)));
    fill.style.width = `${clamped}%`;
    pctText.textContent = `${clamped}%`;
    if (statusText) labelText.textContent = statusText;
    if (isFull) {
      fill.classList.add("full");
    }
  }

  function finishLoadingBarAndShowContent() {
    stopLoadingBar();
    const loadingArea = document.getElementById("loadingArea");
    const card = document.getElementById("loadingCard");

    if (!card) {
      loadingArea.innerHTML = "";
      setMainContentVisible(true);
      return Promise.resolve();
    }

    currentProgress = 100;
    updateLoadingBarVisual(100, "Loading", true);

    return new Promise(resolve => {
      setTimeout(() => {
        card.classList.add("done");
        setTimeout(() => {
          loadingArea.innerHTML = "";
          setMainContentVisible(true);
          resolve();
        }, 220);
      }, 280);
    });
  }

  function stopLoadingBar() {
    if (loadingTimer) {
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
  }

  function getVariantData(pendant, variantKey) {
    if (!pendant || !pendant.variants || !pendant.variants[variantKey]) {
      return { image: "", skills: [] };
    }
    const v = pendant.variants[variantKey];
    return {
      image: String(v.image || "").trim(),
      skills: Array.isArray(v.skills) ? v.skills : []
    };
  }

  function getVariantSkills(pendant, variantKey) {
    return getVariantData(pendant, variantKey).skills;
  }

  function handleHeadImgError(imgEl) {
    imgEl.outerHTML = `<span class="head-thumb-placeholder">ไม่มีรูป</span>`;
  }

  function hideSuggestions(slot) {
    const box = document.getElementById(`suggestionsBox${slot}`);
    if (box) box.classList.remove("show");
  }

  function findMatchingPendants(keyword) {
    const q = keyword.trim().toLowerCase();
    if (!q) return [];

    return pendantDatabase
      .map(item => {
        const nameMatch = (item.name || "").toLowerCase().includes(q);
        let matchedVariant = null;
        let matchedSkillDesc = "";

        for (const vKey of VARIANT_ORDER) {
          const skills = getVariantSkills(item, vKey);
          const found = skills.find(s =>
            (s.desc || "").toLowerCase().includes(q) ||
            String(s.growth || "").toLowerCase().includes(q) ||
            String(s.percent || "").toLowerCase().includes(q)
          );
          if (found) {
            matchedVariant = vKey;
            matchedSkillDesc = found.desc;
            break;
          }
        }

        if (!nameMatch && !matchedVariant) return null;

        if (!matchedVariant) {
          for (const vKey of VARIANT_ORDER) {
            const skills = getVariantSkills(item, vKey);
            if (skills.length > 0) {
              matchedVariant = vKey;
              matchedSkillDesc = skills[0].desc;
              break;
            }
          }
        }

        return {
          pendant: item,
          suggestedVariant: matchedVariant || "normal",
          previewText: matchedSkillDesc
        };
      })
      .filter(Boolean);
  }

  function renderSuggestions(slot) {
    const input = document.getElementById(`searchInput${slot}`);
    const box = document.getElementById(`suggestionsBox${slot}`);

    if (pendantDatabase.length === 0) {
      hideSuggestions(slot);
      return;
    }

    const q = input.value.trim();
    if (!q) {
      hideSuggestions(slot);
      return;
    }

    const matches = findMatchingPendants(q);

    if (matches.length === 0) {
      box.innerHTML = `<div class="suggestion-empty">ไม่พบจี้เครื่องรางที่ตรงกับ "${escapeHtml(q)}"</div>`;
      box.classList.add("show");
      return;
    }

    box.innerHTML = matches
      .map(m => {
        const vLabel = VARIANT_LABELS[m.suggestedVariant] || "Normal";
        const subText = m.previewText ? `[${vLabel}] ${m.previewText}` : `โหมด ${vLabel}`;
        return `
          <div class="suggestion-item" onclick="selectFromSuggestion(${slot}, '${escapeJsAttr(m.pendant.id)}', '${escapeJsAttr(m.pendant.name)}', '${escapeJsAttr(m.suggestedVariant)}')">
            <span class="suggestion-name">${escapeHtml(m.pendant.name)}</span>
            <span class="suggestion-sub">${escapeHtml(subText)}</span>
          </div>
        `;
      })
      .join("");

    box.classList.add("show");
  }

  function selectFromSuggestion(slot, id, name, variantKey) {
    const select = document.getElementById(`pendantSelect${slot}`);
    const input = document.getElementById(`searchInput${slot}`);
    select.value = id;
    input.value = name;
    activeVariants[slot] = VARIANT_ORDER.includes(variantKey) ? variantKey : "normal";
    hideSuggestions(slot);
    updateClearButton(slot);
    renderComparisonTable();
  }

  function triggerSearch(slot) {
    const input = document.getElementById(`searchInput${slot}`);
    const select = document.getElementById(`pendantSelect${slot}`);
    const matches = findMatchingPendants(input.value);

    if (matches.length > 0) {
      select.value = matches[0].pendant.id;
      activeVariants[slot] = matches[0].suggestedVariant || "normal";
      hideSuggestions(slot);
      updateClearButton(slot);
      renderComparisonTable();
    } else {
      renderSuggestions(slot);
    }
  }

  function handleSearchKeydown(event, slot) {
    if (event.key === "Enter") {
      event.preventDefault();
      triggerSearch(slot);
    } else if (event.key === "Escape") {
      hideSuggestions(slot);
    }
  }

  document.addEventListener("click", function (event) {
    document.querySelectorAll(".search-wrapper").forEach(wrapper => {
      if (!wrapper.contains(event.target)) {
        const slot = wrapper.getAttribute("data-slot");
        if (slot) hideSuggestions(slot);
      }
    });
  });

  function updateClearButton(slot) {
    const select = document.getElementById(`pendantSelect${slot}`);
    const clearBtn = document.getElementById(`clearBtn${slot}`);
    clearBtn.disabled = !select.value || pendantDatabase.length === 0;
  }

  function onSelectChange(slot) {
    const selectedId = document.getElementById(`pendantSelect${slot}`).value;
    const pendant = pendantDatabase.find(p => p.id === selectedId);
    if (pendant) {
      const currentSkills = getVariantSkills(pendant, activeVariants[slot]);
      if (currentSkills.length === 0) {
        const firstAvailable = VARIANT_ORDER.find(v => getVariantSkills(pendant, v).length > 0);
        if (firstAvailable) {
          activeVariants[slot] = firstAvailable;
        }
      }
    }
    updateClearButton(slot);
    renderComparisonTable();
  }

  function clearSlot(slot) {
    if (pendantDatabase.length === 0) return;
    const select = document.getElementById(`pendantSelect${slot}`);
    const input = document.getElementById(`searchInput${slot}`);
    select.value = "";
    input.value = "";
    activeVariants[slot] = "normal";
    hideSuggestions(slot);
    updateClearButton(slot);
    renderComparisonTable();
  }

  function selectSlotVariant(slot, variantKey) {
    if (!VARIANT_ORDER.includes(variantKey)) return;
    activeVariants[slot] = variantKey;
    renderComparisonTable();
  }

  function normalizeSkillText(text) {
    return String(text || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function formatGrowthValue(growth) {
    if (growth === null || growth === undefined) {
      return { text: "-", isEmpty: true };
    }

    if (typeof growth === "number") {
      if (isNaN(growth)) return { text: "-", isEmpty: true };
      if (Math.abs(growth) > 0 && Math.abs(growth) < 1) {
        const pct = Math.round(growth * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${growth > 0 ? "+" : ""}${growth}`, isEmpty: false };
    }

    const str = String(growth).trim();
    if (!str || str === "-") {
      return { text: "-", isEmpty: true };
    }

    if (/^[+-]?\d+(\.\d+)?$/.test(str)) {
      const num = Number(str);
      if (Math.abs(num) > 0 && Math.abs(num) < 1) {
        const pct = Math.round(num * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${num > 0 ? "+" : ""}${num}`, isEmpty: false };
    }

    return { text: str, isEmpty: false };
  }

  function renderPendantHeaderHtml(slot, pendant, fallbackTitle) {
    if (!pendant) {
      return `<span class="head-title">${escapeHtml(fallbackTitle)}</span>`;
    }

    const currentVar = activeVariants[slot] || "normal";
    const variantData = getVariantData(pendant, currentVar);
    const imgUrl = variantData.image;

    const imgHtml = imgUrl
      ? `<img class="head-thumb" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(pendant.name)} ${escapeHtml(VARIANT_LABELS[currentVar])}" onerror="handleHeadImgError(this)" />`
      : `<span class="head-thumb-placeholder">ไม่มีรูป</span>`;

    const tabsHtml = VARIANT_ORDER.map(vKey => {
      const hasData = getVariantSkills(pendant, vKey).length > 0;
      const isActive = currentVar === vKey;
      return `
        <button
          type="button"
          class="variant-btn ${isActive ? "active" : ""} ${!hasData ? "no-data" : ""}"
          data-variant="${vKey}"
          onclick="selectSlotVariant(${slot}, '${vKey}')"
        >${escapeHtml(VARIANT_LABELS[vKey])}</button>
      `;
    }).join("");

    return `
      <div class="head-content">
        <span class="head-title">${escapeHtml(pendant.name)}</span>
        ${imgHtml}
        <div class="variant-tabs">${tabsHtml}</div>
      </div>
    `;
  }

  function renderThreeColsForSkill(skillObj, isSlot1End) {
    const endClass = isSlot1End ? "slot-1-end" : "";

    if (!skillObj) {
      return `
        <td class="col-skill"><span class="empty-cell-dash">-</span></td>
        <td class="col-percent"><span class="empty-cell-dash">-</span></td>
        <td class="col-growth ${endClass}"><span class="empty-cell-dash">-</span></td>
      `;
    }

    const percentStr = String(skillObj.percent || "ไม่ระบุเปอร์เซ็นต์");
    const isNoPercent = percentStr === "ไม่ระบุเปอร์เซ็นต์";
    const growthInfo = formatGrowthValue(skillObj.growth);

    return `
      <td class="col-skill">
        <span class="skill-slot-tag">[${skillObj.slotIndex}]</span>${escapeHtml(skillObj.desc)}
      </td>
      <td class="col-percent">
        <span class="percent-badge ${isNoPercent ? 'percent-none' : ''}">
          ${escapeHtml(percentStr)}
        </span>
      </td>
      <td class="col-growth ${endClass}">
        <span class="growth-badge ${growthInfo.isEmpty ? 'growth-empty' : ''}">
          ${escapeHtml(growthInfo.text)}
        </span>
      </td>
    `;
  }

  function renderComparisonTable() {
    const container = document.getElementById("comparisonTableContainer");
    const id1 = document.getElementById("pendantSelect1").value;
    const id2 = document.getElementById("pendantSelect2").value;

    const pendant1 = pendantDatabase.find(p => p.id === id1) || null;
    const pendant2 = pendantDatabase.find(p => p.id === id2) || null;

    if (!pendant1 && !pendant2) {
      container.innerHTML = `<div class="empty-state">กรุณาเลือกจี้เครื่องรางอย่างน้อย 1 ชิ้นเพื่อดูข้อมูล</div>`;
      return;
    }

    const headHtml1 = renderPendantHeaderHtml(1, pendant1, "ยังไม่ได้เลือกจี้ชิ้นที่ 1");
    const headHtml2 = renderPendantHeaderHtml(2, pendant2, "ยังไม่ได้เลือกจี้ชิ้นที่ 2");

    const rawSkills1 = pendant1 ? getVariantSkills(pendant1, activeVariants[1]) : [];
    const rawSkills2 = pendant2 ? getVariantSkills(pendant2, activeVariants[2]) : [];

    const skills1 = rawSkills1.map((s, idx) => ({
      ...s,
      slotIndex: idx + 1,
      norm: normalizeSkillText(s.desc)
    }));

    const skills2 = rawSkills2.map((s, idx) => ({
      ...s,
      slotIndex: idx + 1,
      norm: normalizeSkillText(s.desc)
    }));

    const usedRightIndices = new Set();
    const matchedRows = [];
    const unmatchedLeft = [];

    skills1.forEach(s1 => {
      if (!s1.norm) {
        unmatchedLeft.push(s1);
        return;
      }

      const foundIdx2 = skills2.findIndex((s2, idx2) => !usedRightIndices.has(idx2) && s2.norm === s1.norm);

      if (foundIdx2 !== -1) {
        usedRightIndices.add(foundIdx2);
        matchedRows.push({
          left: s1,
          right: skills2[foundIdx2]
        });
      } else {
        unmatchedLeft.push(s1);
      }
    });

    const unmatchedRight = skills2.filter((_, idx2) => !usedRightIndices.has(idx2));

    let bodyHtml = "";

    matchedRows.forEach(pair => {
      bodyHtml += `
        <tr class="matched-row">
          ${renderThreeColsForSkill(pair.left, true)}
          ${renderThreeColsForSkill(pair.right, false)}
        </tr>
      `;
    });

    const maxDiffRows = Math.max(unmatchedLeft.length, unmatchedRight.length);
    if (maxDiffRows > 0) {
      bodyHtml += `
        <tr class="diff-section-row">
          <td colspan="6">สกิลที่แตกต่าง</td>
        </tr>
      `;

      for (let i = 0; i < maxDiffRows; i++) {
        const leftItem = unmatchedLeft[i] || null;
        const rightItem = unmatchedRight[i] || null;
        bodyHtml += `
          <tr>
            ${renderThreeColsForSkill(leftItem, true)}
            ${renderThreeColsForSkill(rightItem, false)}
          </tr>
        `;
      }
    }

    container.innerHTML = `
      <table class="compare-table">
        <colgroup>
          <col style="width: 24%;" />
          <col style="width: 13%;" />
          <col style="width: 13%;" />
          <col style="width: 24%;" />
          <col style="width: 13%;" />
          <col style="width: 13%;" />
        </colgroup>
        <thead>
          <tr>
            <th colspan="3" class="pendant-head slot-1">${headHtml1}</th>
            <th colspan="3" class="pendant-head">${headHtml2}</th>
          </tr>
          <tr>
            <th class="sub-col-head col-skill">สกิล</th>
            <th class="sub-col-head">เปอร์เซ็นต์</th>
            <th class="sub-col-head slot-1-end">เติบโต</th>
            <th class="sub-col-head col-skill">สกิล</th>
            <th class="sub-col-head">เปอร์เซ็นต์</th>
            <th class="sub-col-head">เติบโต</th>
          </tr>
        </thead>
        <tbody>
          ${bodyHtml || `<tr><td colspan="6" class="empty-state">ไม่มีข้อมูลความสามารถในโหมดที่เลือก</td></tr>`}
        </tbody>
      </table>
    `;
  }

  function fetchJsonp(url, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const callbackName = "handleCompareJsonp_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("หมดเวลาในการเชื่อมต่อ Web App"));
      }, timeoutMs);

      function cleanup() {
        clearTimeout(timer);
        delete window[callbackName];
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function (data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function () {
        cleanup();
        reject(new Error("ไม่สามารถโหลดสคริปต์จาก Web App ได้"));
      };

      const separator = url.includes("?") ? "&" : "?";
      script.src = `${url}${separator}callback=${encodeURIComponent(callbackName)}`;
      document.body.appendChild(script);
    });
  }

  async function loadPendantsForCompare() {
    const select1 = document.getElementById("pendantSelect1");
    const select2 = document.getElementById("pendantSelect2");
    const loadingArea = document.getElementById("loadingArea");
    const errorBox = document.getElementById("globalError");

    errorBox.innerHTML = "";
    startLoadingBar();

    try {
      let json = null;

      try {
        const response = await fetch(WEB_APP_URL);
        const rawText = await response.text();
        json = JSON.parse(rawText);
      } catch (fetchErr) {
        json = await fetchJsonp(WEB_APP_URL);
      }

      if (!json || !json.ok || !Array.isArray(json.data)) {
        throw new Error((json && json.error) || "รูปแบบข้อมูลจาก Web App ไม่ถูกต้อง");
      }

      pendantDatabase = json.data;

      if (pendantDatabase.length === 0) {
        const emptyOpt = `<option value="">ไม่พบข้อมูลจี้เครื่องราง</option>`;
        select1.innerHTML = emptyOpt;
        select2.innerHTML = emptyOpt;
        await finishLoadingBarAndShowContent();
        updateClearButton(1);
        updateClearButton(2);
        return;
      }

      const optionsHtml =
        `<option value="">เลือกจี้เครื่องราง</option>` +
        pendantDatabase
          .map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`)
          .join("");

      select1.innerHTML = optionsHtml;
      select2.innerHTML = optionsHtml;
      select1.value = "";
      select2.value = "";

      await finishLoadingBarAndShowContent();
      updateClearButton(1);
      updateClearButton(2);
      renderComparisonTable();
    } catch (error) {
      stopLoadingBar();
      loadingArea.innerHTML = "";
      setMainContentVisible(false);
      errorBox.innerHTML = `
        <div class="error-box">
          <strong>เกิดข้อผิดพลาดในการดึงข้อมูล:</strong> ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeJsAttr(text) {
    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  loadPendantsForCompare();
</script>

</body>
</html>
