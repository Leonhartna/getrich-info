<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ข้อมูลจี้เครื่องราง V.2</title>
  <style>
    :root {
      --primary: #34546c;
      --primary-hover: #284256;
      --bg: #2c4a5e;
      --card: #48a9bd;
      --card-soft: #54b4c7;
      --card-header: #3897ab;
      --panel-dark: #34546c;
      --panel-darker: #284256;
      --text: #ffffff;
      --text-dark: #0f172a;
      --muted: #dbeafe;
      --border: rgba(255, 255, 255, 0.28);
      --accent: #3897ab;
      --growth-bg: #284256;
      --growth-text: #fef08a;
      --highlight: #fde047;
      --match-bg: rgba(20, 83, 45, 0.52);
      --match-border: rgba(134, 239, 172, 0.55);
      --match-text: #bbf7d0;
      --diff-header-bg: #284256;
      --dark-theme: #284256;
      --white-theme: #0369a1;
      --danger-bg: rgba(153, 27, 27, 0.45);
      --danger-border: rgba(252, 165, 165, 0.55);
      --danger-text: #fecaca;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .page-header-text {
      min-width: 0;
      flex: 1;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px 0;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.94rem;
      margin: 0;
    }

    .compare-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--highlight);
      background-color: var(--panel-darker);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.22);
      transition: 0.15s;
      flex-shrink: 0;
    }

    .compare-toggle-btn:hover {
      background-color: var(--panel-dark);
      border-color: var(--highlight);
      color: #ffffff;
    }

    .compare-toggle-btn.is-open {
      background-color: #991b1b;
      border-color: rgba(252, 165, 165, 0.65);
      color: #ffffff;
    }

    .compare-toggle-btn.is-open:hover {
      background-color: #7f1d1d;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
    }

    .is-hidden {
      display: none !important;
    }

    /* แถบ Loading แบบไฟเต็มหลอด */
    .loading-panel {
      padding: 18px;
      border-radius: 12px;
      background-color: var(--panel-dark);
      border: 1px solid var(--border);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .loading-panel.done {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .loading-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff;
    }

    .loading-percent {
      color: var(--highlight);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .loading-track {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background-color: var(--panel-darker);
      overflow: hidden;
    }

    .loading-fill {
      position: relative;
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #54b4c7, #fde047);
      transition: width 0.22s ease-out;
    }

    .loading-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmerSweep 1.15s infinite;
    }

    .loading-fill.full {
      background: linear-gradient(90deg, #3897ab, #fde047);
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.94rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--panel-darker);
      color: #ffffff;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .search-input:focus {
      border-color: var(--highlight);
      box-shadow: 0 0 0 3px rgba(253, 224, 71, 0.2);
    }

    .search-btn {
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--panel-darker);
      color: var(--highlight);
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover:not(:disabled) {
      background-color: var(--panel-dark);
      border-color: var(--highlight);
      color: #ffffff;
    }

    .search-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--panel-darker);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.45);
      z-index: 30;
      max-height: 260px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.show {
      display: block;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--panel-dark);
    }

    .suggestion-name {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--highlight);
    }

    .suggestion-sub {
      font-size: 0.78rem;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-empty {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .select-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.94rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background-color: #f1f5f9;
      color: var(--text-dark);
      cursor: pointer;
    }

    .clear-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--panel-darker);
      color: #fca5a5;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .clear-btn:hover:not(:disabled) {
      background-color: #991b1b;
      color: #ffffff;
    }

    .clear-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      background-color: var(--panel-dark);
    }

    .pendant-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card-soft);
    }

    .pendant-showcase {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .image-frame {
      width: 82px;
      height: 82px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--panel-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 4px;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .image-placeholder {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      line-height: 1.25;
      padding: 4px;
    }

    .pendant-name-box {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      background-color: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .pendant-title {
      font-size: 1.06rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.35;
    }

    .variant-tabs {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .variant-btn {
      padding: 7px 13px;
      font-size: 0.86rem;
      font-weight: 700;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--panel-dark);
      color: #ffffff;
      cursor: pointer;
      transition: 0.15s;
    }

    .variant-btn:hover:not(:disabled) {
      background-color: var(--panel-darker);
    }

    .variant-btn.active[data-variant="normal"] {
      background-color: var(--panel-darker);
      border-color: var(--highlight);
      color: var(--highlight);
    }

    .variant-btn.active[data-variant="dark"] {
      background-color: var(--dark-theme);
      border-color: #cbd5e1;
      color: #ffffff;
    }

    .variant-btn.active[data-variant="white"] {
      background-color: var(--white-theme);
      border-color: #bae6fd;
      color: #ffffff;
    }

    .variant-btn.no-data {
      opacity: 0.45;
    }

    .empty-variant-box {
      margin-top: 14px;
      padding: 18px;
      border-radius: 10px;
      background-color: var(--panel-dark);
      border: 1px dashed var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    .detail-table th,
    .detail-table td {
      text-align: left;
      padding: 10px 12px;
      border: 1px solid var(--border);
      line-height: 1.45;
      font-size: 0.92rem;
      color: #ffffff;
    }

    .detail-table th {
      background-color: var(--panel-dark);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .detail-table tbody tr td {
      background-color: var(--card-soft);
    }

    .detail-table tbody tr:nth-child(even) td {
      background-color: var(--card-header);
    }

    .col-slot {
      width: 56px;
      text-align: center;
      font-weight: 700;
    }

    .col-percent {
      width: 130px;
      text-align: center;
    }

    .col-growth {
      width: 120px;
      text-align: center;
    }

    .percent-badge {
      display: inline-block;
      background-color: var(--panel-dark);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .percent-none {
      background-color: rgba(40, 66, 86, 0.55);
      color: #cbd5e1;
    }

    .growth-badge {
      display: inline-block;
      background-color: var(--growth-bg);
      border: 1px solid rgba(254, 240, 138, 0.45);
      color: var(--growth-text);
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .growth-empty {
      background-color: rgba(40, 66, 86, 0.55);
      border-color: transparent;
      color: #cbd5e1;
    }

    .error-box {
      color: var(--danger-text);
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.6;
    }

    /* =========================================================
       ส่วนหน้าเปรียบเทียบจี้เครื่องราง (เปิด-ปิดด้วยปุ่มด้านบน)
       ========================================================= */
    .compare-section {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
    }

    .compare-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .compare-section-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .compare-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--highlight);
      background-color: var(--panel-dark);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .control-card {
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .slot-label {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--highlight);
      background-color: var(--panel-dark);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .table-card {
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    .compare-table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .compare-table th,
    .compare-table td {
      padding: 9px 10px;
      border: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.45;
      font-size: 0.88rem;
      color: #ffffff;
      word-wrap: break-word;
    }

    .compare-table th.pendant-head {
      background-color: var(--panel-dark);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      text-align: center;
      padding: 12px 10px;
    }

    .compare-table th.pendant-head.slot-1 {
      border-right: 2px solid rgba(255, 255, 255, 0.45);
    }

    .head-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .head-title {
      line-height: 1.35;
      color: var(--highlight);
    }

    .head-thumb {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 10px;
      background: var(--panel-darker);
      border: 1px solid var(--border);
      padding: 4px;
      flex-shrink: 0;
    }

    .head-thumb-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: var(--panel-darker);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .compare-table th.sub-col-head {
      background-color: var(--panel-darker);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      padding: 8px 6px;
    }

    .compare-table th.sub-col-head.col-skill {
      text-align: left;
      padding-left: 10px;
    }

    .compare-table th.sub-col-head.slot-1-end,
    .compare-table td.slot-1-end {
      border-right: 2px solid rgba(255, 255, 255, 0.45);
    }

    .compare-table td.col-skill {
      text-align: left;
      background-color: var(--card-soft);
    }

    .compare-table td.col-percent,
    .compare-table td.col-growth {
      text-align: center;
      background-color: var(--card-soft);
    }

    .compare-table tr.matched-row td {
      background-color: var(--match-bg);
    }

    .compare-table tr.diff-section-row td {
      background-color: var(--diff-header-bg);
      color: var(--highlight);
      font-weight: 700;
      text-align: center;
      font-size: 0.88rem;
      padding: 8px;
    }

    .skill-slot-tag {
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
      font-size: 0.85em;
    }

    .matched-row .percent-badge {
      background-color: rgba(22, 101, 52, 0.75);
      color: var(--match-text);
      border: 1px solid var(--match-border);
    }

    .empty-cell-dash {
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      display: block;
      font-size: 0.88rem;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .controls-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .page-header {
        gap: 8px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.25rem;
      }

      p.subtitle {
        font-size: 0.84rem;
      }

      .compare-toggle-btn {
        padding: 7px 11px;
        font-size: 0.78rem;
      }

      .card,
      .compare-section {
        padding: 12px;
        border-radius: 12px;
      }

      .compare-section-title {
        font-size: 1.02rem;
      }

      .loading-panel {
        padding: 14px 12px;
      }

      .loading-top {
        font-size: 0.84rem;
      }

      .loading-track {
        height: 11px;
      }

      .search-wrapper {
        margin-bottom: 10px;
      }

      .search-row {
        gap: 6px;
      }

      .search-input {
        padding: 9px 10px;
        font-size: 0.86rem;
      }

      .search-btn {
        padding: 9px 12px;
        font-size: 0.82rem;
      }

      .suggestion-name {
        font-size: 0.84rem;
      }

      .suggestion-sub {
        font-size: 0.72rem;
      }

      .suggestion-empty {
        font-size: 0.8rem;
      }

      .select-row {
        gap: 8px;
      }

      select {
        padding: 9px 10px;
        font-size: 0.88rem;
      }

      .clear-btn {
        width: 38px;
        height: 38px;
        font-size: 0.92rem;
      }

      .pendant-header-bar {
        gap: 8px;
        margin-top: 14px;
        padding: 10px;
      }

      .pendant-showcase {
        gap: 10px;
      }

      .image-frame {
        width: 64px;
        height: 64px;
        border-radius: 10px;
      }

      .image-placeholder {
        font-size: 0.65rem;
      }

      .pendant-name-box {
        padding: 8px 12px;
        border-radius: 8px;
      }

      .pendant-title {
        font-size: 0.9rem;
      }

      .variant-btn {
        padding: 6px 10px;
        font-size: 0.78rem;
      }

      .detail-table {
        margin-top: 12px;
      }

      .detail-table th,
      .detail-table td {
        padding: 8px 6px;
        font-size: 0.76rem;
        line-height: 1.42;
      }

      .col-slot {
        width: 34px;
      }

      .col-percent,
      .col-growth {
        width: auto;
      }

      .percent-badge,
      .growth-badge {
        padding: 2px 6px;
        font-size: 0.7rem;
      }

      .compare-table {
        min-width: 680px;
      }

      .compare-table th,
      .compare-table td {
        padding: 7px 5px;
        font-size: 0.74rem;
        line-height: 1.4;
      }

      .compare-table th.pendant-head {
        font-size: 0.82rem;
        padding: 10px 6px;
      }

      .head-thumb,
      .head-thumb-placeholder {
        width: 48px;
        height: 48px;
        border-radius: 8px;
      }

      .empty-state {
        padding: 22px 10px;
        font-size: 0.82rem;
      }

      .error-box {
        padding: 10px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <div class="page-header-text">
      <h1>ข้อมูลจี้เครื่องราง V.2</h1>
      <p class="subtitle">ค้นหาหรือเลือกจี้เครื่องราง แล้วสลับดูแบบ Normal, [ดาร์ค] และ [ไวท์]</p>
    </div>
    <button
      id="toggleCompareBtn"
      type="button"
      class="compare-toggle-btn is-hidden"
      onclick="toggleCompareSection()"
    >เปรียบเทียบจี้</button>
  </div>

  <div class="card">
    <div id="loadingArea"></div>

    <div id="mainControls" class="is-hidden">
      <div class="search-wrapper" id="mainSearchWrapper">
        <div class="search-row">
          <input
            id="pendantSearchInput"
            class="search-input"
            type="text"
            placeholder="พิมพ์ชื่อจี้เครื่องราง หรือคำในความสามารถ..."
            autocomplete="off"
            oninput="renderMainSuggestions()"
            onfocus="renderMainSuggestions()"
            onkeydown="handleMainSearchKeydown(event)"
          />
          <button
            id="searchBtn"
            class="search-btn"
            type="button"
            onclick="triggerMainSearch()"
          >Search</button>
        </div>
        <div id="mainSuggestionsBox" class="suggestions-box"></div>
      </div>

      <div class="select-row">
        <select id="pendantSelect" onchange="handlePendantDropdownChange()"></select>
        <button
          id="clearSelectionBtn"
          class="clear-btn"
          type="button"
          title="ล้างค่าการเลือก"
          aria-label="ล้างค่าการเลือก"
          onclick="clearSelection()"
          disabled
        >✕</button>
      </div>
    </div>

    <div id="pendantDetails"></div>
  </div>

  <!-- หน้าเปรียบเทียบจี้เครื่องราง (ซ่อนอยู่จนกว่าจะกดปุ่ม "เปรียบเทียบจี้") -->
  <section id="compareSection" class="compare-section is-hidden" aria-label="เปรียบเทียบจี้เครื่องราง">
    <div class="compare-section-header">
      <h2 class="compare-section-title">เปรียบเทียบจี้เครื่องราง V.2</h2>
      <span class="compare-badge">โหมดเปรียบเทียบ 2 ชิ้น</span>
    </div>

    <div class="controls-grid">
      <!-- จี้เครื่องรางชิ้นที่ 1 -->
      <div class="control-card">
        <div class="slot-label">จี้เครื่องรางชิ้นที่ 1</div>

        <div class="search-wrapper" data-slot="1">
          <div class="search-row">
            <input
              id="searchInput1"
              class="search-input"
              type="text"
              placeholder="พิมพ์ชื่อจี้ หรือคำในความสามารถ..."
              autocomplete="off"
              oninput="renderCompareSuggestions(1)"
              onfocus="renderCompareSuggestions(1)"
              onkeydown="handleCompareSearchKeydown(event, 1)"
            />
            <button
              id="searchBtn1"
              class="search-btn"
              type="button"
              onclick="triggerCompareSearch(1)"
            >Search</button>
          </div>
          <div id="suggestionsBox1" class="suggestions-box"></div>
        </div>

        <div class="select-row">
          <select id="pendantSelect1" onchange="onCompareSelectChange(1)"></select>
          <button
            id="clearBtn1"
            class="clear-btn"
            type="button"
            title="ล้างค่าจี้ชิ้นที่ 1"
            aria-label="ล้างค่าจี้ชิ้นที่ 1"
            onclick="clearCompareSlot(1)"
            disabled
          >✕</button>
        </div>
      </div>

      <!-- จี้เครื่องรางชิ้นที่ 2 -->
      <div class="control-card">
        <div class="slot-label">จี้เครื่องรางชิ้นที่ 2</div>

        <div class="search-wrapper" data-slot="2">
          <div class="search-row">
            <input
              id="searchInput2"
              class="search-input"
              type="text"
              placeholder="พิมพ์ชื่อจี้ หรือคำในความสามารถ..."
              autocomplete="off"
              oninput="renderCompareSuggestions(2)"
              onfocus="renderCompareSuggestions(2)"
              onkeydown="handleCompareSearchKeydown(event, 2)"
            />
            <button
              id="searchBtn2"
              class="search-btn"
              type="button"
              onclick="triggerCompareSearch(2)"
            >Search</button>
          </div>
          <div id="suggestionsBox2" class="suggestions-box"></div>
        </div>

        <div class="select-row">
          <select id="pendantSelect2" onchange="onCompareSelectChange(2)"></select>
          <button
            id="clearBtn2"
            class="clear-btn"
            type="button"
            title="ล้างค่าจี้ชิ้นที่ 2"
            aria-label="ล้างค่าจี้ชิ้นที่ 2"
            onclick="clearCompareSlot(2)"
            disabled
          >✕</button>
        </div>
      </div>
    </div>

    <div class="table-card" id="comparisonTableContainer">
      <div class="empty-state">กรุณาเลือกจี้เครื่องรางอย่างน้อย 1 ชิ้นเพื่อดูข้อมูล</div>
    </div>
  </section>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4fmF9t573ywsirLCRnaQZZqUsPFxeSMX8oH2fhz9E6OtiIlC46LumfuRYLsxfTEOldw/exec";
  const VARIANT_ORDER = ["normal", "dark", "white"];
  const VARIANT_LABELS = {
    normal: "Normal",
    dark: "[ดาร์ค]",
    white: "[ไวท์]"
  };

  let pendantDatabase = [];
  let activeVariant = "normal";
  let isCompareOpen = false;
  const activeCompareVariants = {
    1: "normal",
    2: "normal"
  };

  let loadingTimer = null;
  let currentProgress = 0;

  function setMainControlsVisible(visible) {
    const mainControls = document.getElementById("mainControls");
    const toggleBtn = document.getElementById("toggleCompareBtn");
    if (mainControls) {
      if (visible) {
        mainControls.classList.remove("is-hidden");
      } else {
        mainControls.classList.add("is-hidden");
      }
    }
    if (toggleBtn) {
      if (visible) {
        toggleBtn.classList.remove("is-hidden");
      } else {
        toggleBtn.classList.add("is-hidden");
      }
    }
  }

  function updateCompareToggleButton() {
    const btn = document.getElementById("toggleCompareBtn");
    const section = document.getElementById("compareSection");
    if (!btn || !section) return;

    if (isCompareOpen) {
      section.classList.remove("is-hidden");
      btn.classList.add("is-open");
      btn.textContent = "ปิดการเปรียบเทียบ";
    } else {
      section.classList.add("is-hidden");
      btn.classList.remove("is-open");
      btn.textContent = "เปรียบเทียบจี้";
    }
  }

  function toggleCompareSection() {
    isCompareOpen = !isCompareOpen;
    updateCompareToggleButton();
    if (isCompareOpen) {
      renderComparisonTable();
      document.getElementById("compareSection").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function startLoadingBar() {
    const loadingArea = document.getElementById("loadingArea");
    const detailsArea = document.getElementById("pendantDetails");
    stopLoadingBar();
    currentProgress = 12;
    setMainControlsVisible(false);
    isCompareOpen = false;
    updateCompareToggleButton();
    detailsArea.innerHTML = "";

    loadingArea.innerHTML = `
      <div id="loadingPanel" class="loading-panel">
        <div class="loading-top">
          <span id="loadingStatusText">Loading</span>
          <span id="loadingPercentText" class="loading-percent">12%</span>
        </div>
        <div class="loading-track">
          <div id="loadingFillBar" class="loading-fill" style="width: 12%;"></div>
        </div>
      </div>
    `;

    loadingTimer = setInterval(() => {
      if (currentProgress < 90) {
        const step = currentProgress < 50 ? 7 : currentProgress < 75 ? 4 : 2;
        currentProgress = Math.min(90, currentProgress + step);
        updateLoadingBarVisual(currentProgress, "Loading", false);
      }
    }, 220);
  }

  function updateLoadingBarVisual(pct, statusText, isFull) {
    const fill = document.getElementById("loadingFillBar");
    const pctText = document.getElementById("loadingPercentText");
    const labelText = document.getElementById("loadingStatusText");
    if (!fill || !pctText || !labelText) return;

    const clamped = Math.max(0, Math.min(100, Math.round(pct)));
    fill.style.width = `${clamped}%`;
    pctText.textContent = `${clamped}%`;
    if (statusText) labelText.textContent = statusText;
    if (isFull) {
      fill.classList.add("full");
    }
  }

  function finishLoadingBarAndShowControls() {
    stopLoadingBar();
    const loadingArea = document.getElementById("loadingArea");
    const panel = document.getElementById("loadingPanel");

    if (!panel) {
      loadingArea.innerHTML = "";
      setMainControlsVisible(true);
      return Promise.resolve();
    }

    currentProgress = 100;
    updateLoadingBarVisual(100, "Loading", true);

    return new Promise(resolve => {
      setTimeout(() => {
        panel.classList.add("done");
        setTimeout(() => {
          loadingArea.innerHTML = "";
          setMainControlsVisible(true);
          resolve();
        }, 220);
      }, 280);
    });
  }

  function stopLoadingBar() {
    if (loadingTimer) {
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
  }

  function getVariantData(pendant, variantKey) {
    if (!pendant || !pendant.variants || !pendant.variants[variantKey]) {
      return { image: "", skills: [] };
    }
    const v = pendant.variants[variantKey];
    return {
      image: String(v.image || "").trim(),
      skills: Array.isArray(v.skills) ? v.skills : []
    };
  }

  function getVariantSkills(pendant, variantKey) {
    return getVariantData(pendant, variantKey).skills;
  }

  function handleImgError(imgEl) {
    imgEl.outerHTML = `<span class="image-placeholder">ไม่มีรูป</span>`;
  }

  function handleHeadImgError(imgEl) {
    imgEl.outerHTML = `<span class="head-thumb-placeholder">ไม่มีรูป</span>`;
  }

  function formatGrowthValue(growth) {
    if (growth === null || growth === undefined) {
      return { text: "-", isEmpty: true };
    }

    if (typeof growth === "number") {
      if (isNaN(growth)) return { text: "-", isEmpty: true };
      if (Math.abs(growth) > 0 && Math.abs(growth) < 1) {
        const pct = Math.round(growth * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${growth > 0 ? "+" : ""}${growth}`, isEmpty: false };
    }

    const str = String(growth).trim();
    if (!str || str === "-") {
      return { text: "-", isEmpty: true };
    }

    if (/^[+-]?\d+(\.\d+)?$/.test(str)) {
      const num = Number(str);
      if (Math.abs(num) > 0 && Math.abs(num) < 1) {
        const pct = Math.round(num * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${num > 0 ? "+" : ""}${num}`, isEmpty: false };
    }

    return { text: str, isEmpty: false };
  }

  function normalizeSkillText(text) {
    return String(text || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function hideMainSuggestions() {
    const box = document.getElementById("mainSuggestionsBox");
    if (box) box.classList.remove("show");
  }

  function hideCompareSuggestions(slot) {
    const box = document.getElementById(`suggestionsBox${slot}`);
    if (box) box.classList.remove("show");
  }

  function findMatchingPendants(keyword) {
    const q = keyword.trim().toLowerCase();
    if (!q) return [];

    return pendantDatabase
      .map(item => {
        const nameMatch = (item.name || "").toLowerCase().includes(q);
        let matchedVariant = null;
        let matchedSkillDesc = "";

        for (const vKey of VARIANT_ORDER) {
          const skills = getVariantSkills(item, vKey);
          const found = skills.find(s =>
            (s.desc || "").toLowerCase().includes(q) ||
            String(s.growth || "").toLowerCase().includes(q) ||
            String(s.percent || "").toLowerCase().includes(q)
          );
          if (found) {
            matchedVariant = vKey;
            matchedSkillDesc = found.desc;
            break;
          }
        }

        if (!nameMatch && !matchedVariant) return null;

        if (!matchedVariant) {
          for (const vKey of VARIANT_ORDER) {
            const skills = getVariantSkills(item, vKey);
            if (skills.length > 0) {
              matchedVariant = vKey;
              matchedSkillDesc = skills[0].desc;
              break;
            }
          }
        }

        return {
          pendant: item,
          suggestedVariant: matchedVariant || "normal",
          previewText: matchedSkillDesc
        };
      })
      .filter(Boolean);
  }

  function renderMainSuggestions() {
    const input = document.getElementById("pendantSearchInput");
    const box = document.getElementById("mainSuggestionsBox");

    if (pendantDatabase.length === 0) {
      hideMainSuggestions();
      return;
    }

    const q = input.value.trim();
    if (!q) {
      hideMainSuggestions();
      return;
    }

    const matches = findMatchingPendants(q);

    if (matches.length === 0) {
      box.innerHTML = `<div class="suggestion-empty">ไม่พบจี้เครื่องรางที่ตรงกับ "${escapeHtml(q)}"</div>`;
      box.classList.add("show");
      return;
    }

    box.innerHTML = matches
      .map(m => {
        const vLabel = VARIANT_LABELS[m.suggestedVariant] || "Normal";
        const subText = m.previewText ? `[${vLabel}] ${m.previewText}` : `โหมด ${vLabel}`;
        return `
          <div class="suggestion-item" onclick="selectPendantFromMainSuggestion('${escapeJsAttr(m.pendant.id)}', '${escapeJsAttr(m.pendant.name)}', '${escapeJsAttr(m.suggestedVariant)}')">
            <span class="suggestion-name">${escapeHtml(m.pendant.name)}</span>
            <span class="suggestion-sub">${escapeHtml(subText)}</span>
          </div>
        `;
      })
      .join("");

    box.classList.add("show");
  }

  function selectPendantFromMainSuggestion(id, name, variantKey) {
    const select = document.getElementById("pendantSelect");
    const input = document.getElementById("pendantSearchInput");
    select.value = id;
    input.value = name;
    activeVariant = VARIANT_ORDER.includes(variantKey) ? variantKey : "normal";
    hideMainSuggestions();
    renderSelectedPendant();
  }

  function triggerMainSearch() {
    const input = document.getElementById("pendantSearchInput");
    const select = document.getElementById("pendantSelect");
    const matches = findMatchingPendants(input.value);

    if (matches.length > 0) {
      select.value = matches[0].pendant.id;
      activeVariant = matches[0].suggestedVariant || "normal";
      hideMainSuggestions();
      renderSelectedPendant();
    } else {
      renderMainSuggestions();
    }
  }

  function handleMainSearchKeydown(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      triggerMainSearch();
    } else if (event.key === "Escape") {
      hideMainSuggestions();
    }
  }

  function renderCompareSuggestions(slot) {
    const input = document.getElementById(`searchInput${slot}`);
    const box = document.getElementById(`suggestionsBox${slot}`);

    if (pendantDatabase.length === 0) {
      hideCompareSuggestions(slot);
      return;
    }

    const q = input.value.trim();
    if (!q) {
      hideCompareSuggestions(slot);
      return;
    }

    const matches = findMatchingPendants(q);

    if (matches.length === 0) {
      box.innerHTML = `<div class="suggestion-empty">ไม่พบจี้เครื่องรางที่ตรงกับ "${escapeHtml(q)}"</div>`;
      box.classList.add("show");
      return;
    }

    box.innerHTML = matches
      .map(m => {
        const vLabel = VARIANT_LABELS[m.suggestedVariant] || "Normal";
        const subText = m.previewText ? `[${vLabel}] ${m.previewText}` : `โหมด ${vLabel}`;
        return `
          <div class="suggestion-item" onclick="selectFromCompareSuggestion(${slot}, '${escapeJsAttr(m.pendant.id)}', '${escapeJsAttr(m.pendant.name)}', '${escapeJsAttr(m.suggestedVariant)}')">
            <span class="suggestion-name">${escapeHtml(m.pendant.name)}</span>
            <span class="suggestion-sub">${escapeHtml(subText)}</span>
          </div>
        `;
      })
      .join("");

    box.classList.add("show");
  }

  function selectFromCompareSuggestion(slot, id, name, variantKey) {
    const select = document.getElementById(`pendantSelect${slot}`);
    const input = document.getElementById(`searchInput${slot}`);
    select.value = id;
    input.value = name;
    activeCompareVariants[slot] = VARIANT_ORDER.includes(variantKey) ? variantKey : "normal";
    hideCompareSuggestions(slot);
    updateCompareClearButton(slot);
    renderComparisonTable();
  }

  function triggerCompareSearch(slot) {
    const input = document.getElementById(`searchInput${slot}`);
    const select = document.getElementById(`pendantSelect${slot}`);
    const matches = findMatchingPendants(input.value);

    if (matches.length > 0) {
      select.value = matches[0].pendant.id;
      activeCompareVariants[slot] = matches[0].suggestedVariant || "normal";
      hideCompareSuggestions(slot);
      updateCompareClearButton(slot);
      renderComparisonTable();
    } else {
      renderCompareSuggestions(slot);
    }
  }

  function handleCompareSearchKeydown(event, slot) {
    if (event.key === "Enter") {
      event.preventDefault();
      triggerCompareSearch(slot);
    } else if (event.key === "Escape") {
      hideCompareSuggestions(slot);
    }
  }

  document.addEventListener("click", function (event) {
    const mainWrap = document.getElementById("mainSearchWrapper");
    if (mainWrap && !mainWrap.contains(event.target)) {
      hideMainSuggestions();
    }

    document.querySelectorAll(".search-wrapper[data-slot]").forEach(wrapper => {
      if (!wrapper.contains(event.target)) {
        const slot = wrapper.getAttribute("data-slot");
        if (slot) hideCompareSuggestions(slot);
      }
    });
  });

  function updateClearButtonState() {
    const select = document.getElementById("pendantSelect");
    const clearBtn = document.getElementById("clearSelectionBtn");
    clearBtn.disabled = !select.value || pendantDatabase.length === 0;
  }

  function clearSelection() {
    const select = document.getElementById("pendantSelect");
    const input = document.getElementById("pendantSearchInput");
    if (pendantDatabase.length === 0) return;
    select.value = "";
    input.value = "";
    activeVariant = "normal";
    hideMainSuggestions();
    renderSelectedPendant();
  }

  function handlePendantDropdownChange() {
    const selectedId = document.getElementById("pendantSelect").value;
    const pendant = pendantDatabase.find(p => p.id === selectedId);
    if (pendant) {
      const currentSkills = getVariantSkills(pendant, activeVariant);
      if (currentSkills.length === 0) {
        const firstAvailable = VARIANT_ORDER.find(v => getVariantSkills(pendant, v).length > 0);
        if (firstAvailable) {
          activeVariant = firstAvailable;
        }
      }
    }
    renderSelectedPendant();
  }

  function selectVariant(variantKey) {
    if (!VARIANT_ORDER.includes(variantKey)) return;
    activeVariant = variantKey;
    renderSelectedPendant();
  }

  function updateCompareClearButton(slot) {
    const select = document.getElementById(`pendantSelect${slot}`);
    const clearBtn = document.getElementById(`clearBtn${slot}`);
    if (!select || !clearBtn) return;
    clearBtn.disabled = !select.value || pendantDatabase.length === 0;
  }

  function onCompareSelectChange(slot) {
    const selectedId = document.getElementById(`pendantSelect${slot}`).value;
    const pendant = pendantDatabase.find(p => p.id === selectedId);
    if (pendant) {
      const currentSkills = getVariantSkills(pendant, activeCompareVariants[slot]);
      if (currentSkills.length === 0) {
        const firstAvailable = VARIANT_ORDER.find(v => getVariantSkills(pendant, v).length > 0);
        if (firstAvailable) {
          activeCompareVariants[slot] = firstAvailable;
        }
      }
    }
    updateCompareClearButton(slot);
    renderComparisonTable();
  }

  function clearCompareSlot(slot) {
    if (pendantDatabase.length === 0) return;
    const select = document.getElementById(`pendantSelect${slot}`);
    const input = document.getElementById(`searchInput${slot}`);
    select.value = "";
    input.value = "";
    activeCompareVariants[slot] = "normal";
    hideCompareSuggestions(slot);
    updateCompareClearButton(slot);
    renderComparisonTable();
  }

  function selectCompareSlotVariant(slot, variantKey) {
    if (!VARIANT_ORDER.includes(variantKey)) return;
    activeCompareVariants[slot] = variantKey;
    renderComparisonTable();
  }

  function renderCompareHeaderHtml(slot, pendant, fallbackTitle) {
    if (!pendant) {
      return `<span class="head-title">${escapeHtml(fallbackTitle)}</span>`;
    }

    const currentVar = activeCompareVariants[slot] || "normal";
    const variantData = getVariantData(pendant, currentVar);
    const imgUrl = variantData.image;

    const imgHtml = imgUrl
      ? `<img class="head-thumb" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(pendant.name)} ${escapeHtml(VARIANT_LABELS[currentVar])}" onerror="handleHeadImgError(this)" />`
      : `<span class="head-thumb-placeholder">ไม่มีรูป</span>`;

    const tabsHtml = VARIANT_ORDER.map(vKey => {
      const hasData = getVariantSkills(pendant, vKey).length > 0;
      const isActive = currentVar === vKey;
      return `
        <button
          type="button"
          class="variant-btn ${isActive ? "active" : ""} ${!hasData ? "no-data" : ""}"
          data-variant="${vKey}"
          onclick="selectCompareSlotVariant(${slot}, '${vKey}')"
        >${escapeHtml(VARIANT_LABELS[vKey])}</button>
      `;
    }).join("");

    return `
      <div class="head-content">
        <span class="head-title">${escapeHtml(pendant.name)}</span>
        ${imgHtml}
        <div class="variant-tabs">${tabsHtml}</div>
      </div>
    `;
  }

  function renderThreeColsForSkill(skillObj, isSlot1End) {
    const endClass = isSlot1End ? "slot-1-end" : "";

    if (!skillObj) {
      return `
        <td class="col-skill"><span class="empty-cell-dash">-</span></td>
        <td class="col-percent"><span class="empty-cell-dash">-</span></td>
        <td class="col-growth ${endClass}"><span class="empty-cell-dash">-</span></td>
      `;
    }

    const percentStr = String(skillObj.percent || "ไม่ระบุเปอร์เซ็นต์");
    const isNoPercent = percentStr === "ไม่ระบุเปอร์เซ็นต์";
    const growthInfo = formatGrowthValue(skillObj.growth);

    return `
      <td class="col-skill">
        <span class="skill-slot-tag">[${skillObj.slotIndex}]</span>${escapeHtml(skillObj.desc)}
      </td>
      <td class="col-percent">
        <span class="percent-badge ${isNoPercent ? 'percent-none' : ''}">
          ${escapeHtml(percentStr)}
        </span>
      </td>
      <td class="col-growth ${endClass}">
        <span class="growth-badge ${growthInfo.isEmpty ? 'growth-empty' : ''}">
          ${escapeHtml(growthInfo.text)}
        </span>
      </td>
    `;
  }

  function renderComparisonTable() {
    const container = document.getElementById("comparisonTableContainer");
    const id1 = document.getElementById("pendantSelect1").value;
    const id2 = document.getElementById("pendantSelect2").value;

    const pendant1 = pendantDatabase.find(p => p.id === id1) || null;
    const pendant2 = pendantDatabase.find(p => p.id === id2) || null;

    if (!pendant1 && !pendant2) {
      container.innerHTML = `<div class="empty-state">กรุณาเลือกจี้เครื่องรางอย่างน้อย 1 ชิ้นเพื่อดูข้อมูล</div>`;
      return;
    }

    const headHtml1 = renderCompareHeaderHtml(1, pendant1, "ยังไม่ได้เลือกจี้ชิ้นที่ 1");
    const headHtml2 = renderCompareHeaderHtml(2, pendant2, "ยังไม่ได้เลือกจี้ชิ้นที่ 2");

    const rawSkills1 = pendant1 ? getVariantSkills(pendant1, activeCompareVariants[1]) : [];
    const rawSkills2 = pendant2 ? getVariantSkills(pendant2, activeCompareVariants[2]) : [];

    const skills1 = rawSkills1.map((s, idx) => ({
      ...s,
      slotIndex: idx + 1,
      norm: normalizeSkillText(s.desc)
    }));

    const skills2 = rawSkills2.map((s, idx) => ({
      ...s,
      slotIndex: idx + 1,
      norm: normalizeSkillText(s.desc)
    }));

    const usedRightIndices = new Set();
    const matchedRows = [];
    const unmatchedLeft = [];

    skills1.forEach(s1 => {
      if (!s1.norm) {
        unmatchedLeft.push(s1);
        return;
      }

      const foundIdx2 = skills2.findIndex((s2, idx2) => !usedRightIndices.has(idx2) && s2.norm === s1.norm);

      if (foundIdx2 !== -1) {
        usedRightIndices.add(foundIdx2);
        matchedRows.push({
          left: s1,
          right: skills2[foundIdx2]
        });
      } else {
        unmatchedLeft.push(s1);
      }
    });

    const unmatchedRight = skills2.filter((_, idx2) => !usedRightIndices.has(idx2));

    let bodyHtml = "";

    matchedRows.forEach(pair => {
      bodyHtml += `
        <tr class="matched-row">
          ${renderThreeColsForSkill(pair.left, true)}
          ${renderThreeColsForSkill(pair.right, false)}
        </tr>
      `;
    });

    const maxDiffRows = Math.max(unmatchedLeft.length, unmatchedRight.length);
    if (maxDiffRows > 0) {
      bodyHtml += `
        <tr class="diff-section-row">
          <td colspan="6">สกิลที่แตกต่าง</td>
        </tr>
      `;

      for (let i = 0; i < maxDiffRows; i++) {
        const leftItem = unmatchedLeft[i] || null;
        const rightItem = unmatchedRight[i] || null;
        bodyHtml += `
          <tr>
            ${renderThreeColsForSkill(leftItem, true)}
            ${renderThreeColsForSkill(rightItem, false)}
          </tr>
        `;
      }
    }

    container.innerHTML = `
      <table class="compare-table">
        <colgroup>
          <col style="width: 24%;" />
          <col style="width: 13%;" />
          <col style="width: 13%;" />
          <col style="width: 24%;" />
          <col style="width: 13%;" />
          <col style="width: 13%;" />
        </colgroup>
        <thead>
          <tr>
            <th colspan="3" class="pendant-head slot-1">${headHtml1}</th>
            <th colspan="3" class="pendant-head">${headHtml2}</th>
          </tr>
          <tr>
            <th class="sub-col-head col-skill">สกิล</th>
            <th class="sub-col-head">เปอร์เซ็นต์</th>
            <th class="sub-col-head slot-1-end">เติบโต</th>
            <th class="sub-col-head col-skill">สกิล</th>
            <th class="sub-col-head">เปอร์เซ็นต์</th>
            <th class="sub-col-head">เติบโต</th>
          </tr>
        </thead>
        <tbody>
          ${bodyHtml || `<tr><td colspan="6" class="empty-state">ไม่มีข้อมูลความสามารถในโหมดที่เลือก</td></tr>`}
        </tbody>
      </table>
    `;
  }

  function fetchJsonp(url, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const callbackName = "handlePendantJsonp_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("หมดเวลาในการเชื่อมต่อ Web App"));
      }, timeoutMs);

      function cleanup() {
        clearTimeout(timer);
        delete window[callbackName];
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function (data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function () {
        cleanup();
        reject(new Error("ไม่สามารถโหลดสคริปต์จาก Web App ได้"));
      };

      const separator = url.includes("?") ? "&" : "?";
      script.src = `${url}${separator}callback=${encodeURIComponent(callbackName)}`;
      document.body.appendChild(script);
    });
  }

  async function loadPendantsFromSheet() {
    const select = document.getElementById("pendantSelect");
    const select1 = document.getElementById("pendantSelect1");
    const select2 = document.getElementById("pendantSelect2");
    const loadingArea = document.getElementById("loadingArea");
    const container = document.getElementById("pendantDetails");

    startLoadingBar();

    try {
      let json = null;

      try {
        const response = await fetch(WEB_APP_URL);
        const rawText = await response.text();
        json = JSON.parse(rawText);
      } catch (fetchErr) {
        json = await fetchJsonp(WEB_APP_URL);
      }

      if (!json || !json.ok || !Array.isArray(json.data)) {
        throw new Error((json && json.error) || "รูปแบบข้อมูลจาก Web App ไม่ถูกต้อง");
      }

      pendantDatabase = json.data;

      if (pendantDatabase.length === 0) {
        const emptyOpt = `<option value="">ไม่พบข้อมูลจี้เครื่องราง</option>`;
        select.innerHTML = emptyOpt;
        select1.innerHTML = emptyOpt;
        select2.innerHTML = emptyOpt;
        await finishLoadingBarAndShowControls();
        updateClearButtonState();
        updateCompareClearButton(1);
        updateCompareClearButton(2);
        return;
      }

      const itemOptions = pendantDatabase
        .map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`)
        .join("");

      select.innerHTML = `<option value="">เลือกจี้เครื่องราง</option>` + itemOptions;
      select.value = "";

      const compareOptionsHtml = `<option value="">เลือกจี้เครื่องราง</option>` + itemOptions;
      select1.innerHTML = compareOptionsHtml;
      select2.innerHTML = compareOptionsHtml;
      select1.value = "";
      select2.value = "";

      await finishLoadingBarAndShowControls();
      updateClearButtonState();
      updateCompareClearButton(1);
      updateCompareClearButton(2);
      renderSelectedPendant();
      renderComparisonTable();
    } catch (error) {
      stopLoadingBar();
      loadingArea.innerHTML = "";
      setMainControlsVisible(false);
      container.innerHTML = `
        <div class="error-box">
          <strong>เกิดข้อผิดพลาดในการดึงข้อมูล:</strong><br/>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function renderSelectedPendant() {
    const selectedId = document.getElementById("pendantSelect").value;
    const container = document.getElementById("pendantDetails");

    updateClearButtonState();

    if (!selectedId) {
      container.innerHTML = "";
      return;
    }

    const pendant = pendantDatabase.find(p => p.id === selectedId);
    if (!pendant) {
      container.innerHTML = "";
      return;
    }

    const variantData = getVariantData(pendant, activeVariant);
    const currentSkills = variantData.skills;
    const imageUrl = variantData.image;

    const imageContentHtml = imageUrl
      ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(pendant.name)} ${escapeHtml(VARIANT_LABELS[activeVariant])}" onerror="handleImgError(this)" />`
      : `<span class="image-placeholder">ไม่มีรูป</span>`;

    const tabsHtml = VARIANT_ORDER.map(vKey => {
      const skills = getVariantSkills(pendant, vKey);
      const isActive = activeVariant === vKey;
      const hasData = skills.length > 0;
      return `
        <button
          type="button"
          class="variant-btn ${isActive ? "active" : ""} ${!hasData ? "no-data" : ""}"
          data-variant="${vKey}"
          onclick="selectVariant('${vKey}')"
        >${escapeHtml(VARIANT_LABELS[vKey])}</button>
      `;
    }).join("");

    const headerBarHtml = `
      <div class="pendant-header-bar">
        <div class="pendant-showcase">
          <div class="image-frame">${imageContentHtml}</div>
          <div class="pendant-name-box">
            <h2 class="pendant-title">${escapeHtml(pendant.name)}</h2>
          </div>
        </div>
        <div class="variant-tabs">${tabsHtml}</div>
      </div>
    `;

    if (currentSkills.length === 0) {
      container.innerHTML = `
        ${headerBarHtml}
        <div class="empty-variant-box">
          ไม่มีข้อมูลความสามารถสำหรับโหมด <strong>${escapeHtml(VARIANT_LABELS[activeVariant])}</strong>
        </div>
      `;
      return;
    }

    const rowsHtml = currentSkills
      .map((skill, index) => {
        const percentStr = String(skill.percent || "ไม่ระบุเปอร์เซ็นต์");
        const isNoPercent = percentStr === "ไม่ระบุเปอร์เซ็นต์";
        const growthInfo = formatGrowthValue(skill.growth);

        return `
          <tr>
            <td class="col-slot">${index + 1}</td>
            <td>${escapeHtml(skill.desc)}</td>
            <td class="col-percent">
              <span class="percent-badge ${isNoPercent ? 'percent-none' : ''}">
                ${escapeHtml(percentStr)}
              </span>
            </td>
            <td class="col-growth">
              <span class="growth-badge ${growthInfo.isEmpty ? 'growth-empty' : ''}">
                ${escapeHtml(growthInfo.text)}
              </span>
            </td>
          </tr>
        `;
      })
      .join("");

    container.innerHTML = `
      ${headerBarHtml}
      <table class="detail-table">
        <thead>
          <tr>
            <th class="col-slot">ช่อง</th>
            <th>ความสามารถ (Skill)</th>
            <th class="col-percent">เปอร์เซ็นต์</th>
            <th class="col-growth">เติบโต</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeJsAttr(text) {
    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  loadPendantsFromSheet();
</script>
