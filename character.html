<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ข้อมูลตัวละคร</title>
  <style>
    :root {
      --primary: #48a9bd;
      --primary-hover: #3897ab;
      --primary-light: #54b4c7;
      --bg: #2c4a5e;
      --card: #34546c;
      --surface: #284256;
      --surface-soft: #233a4c;
      --panel-dark: #34546c;
      --panel-darker: #284256;
      --text: #ffffff;
      --muted: #dbeafe;
      --border: rgba(255, 255, 255, 0.28);
      --accent: rgba(72, 169, 189, 0.24);
      --growth-bg: rgba(254, 240, 138, 0.18);
      --growth-text: #fef08a;
      --evo-theme: #0284c7;
      --legend-theme: #d97706;
      --mystic-theme: #7c3aed;
      --costume-accent: #284256;
      --costume-border: rgba(255, 255, 255, 0.35);
      --costume-text: #fde047;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .top-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .top-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-size: 0.86rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: var(--panel-darker);
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .back-btn:hover {
      background-color: var(--panel-dark);
      border-color: #fde047;
      color: #fde047;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0;
      color: #ffffff;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
    }

    .is-hidden {
      display: none !important;
    }

    /* แถบ Loading แบบไฟเต็มหลอด */
    .loading-panel {
      padding: 18px 16px;
      border-radius: 10px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .loading-panel.done {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .loading-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .loading-percent {
      color: #fde047;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .loading-track {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background-color: var(--surface-soft);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.35);
    }

    .loading-fill {
      position: relative;
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #48a9bd 0%, #54b4c7 60%, #fde047 100%);
      box-shadow: 0 0 12px rgba(72, 169, 189, 0.55);
      transition: width 0.22s ease-out, box-shadow 0.25s ease;
    }

    .loading-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmerSweep 1.15s infinite;
    }

    .loading-fill.full {
      background: linear-gradient(90deg, #16a34a 0%, #22c55e 65%, #4ade80 100%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.75);
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      font-size: 0.98rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--surface);
      color: var(--text);
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .search-input:focus {
      border-color: #fde047;
      box-shadow: 0 0 0 3px rgba(253, 224, 71, 0.2);
    }

    .search-btn {
      padding: 11px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--primary);
      color: #ffffff;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .search-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.4);
      z-index: 30;
      max-height: 260px;
      overflow-y: auto;
      display: none;
    }

    .suggestions-box.show {
      display: block;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--card);
    }

    .suggestion-name {
      font-weight: 700;
      font-size: 0.94rem;
      color: #fde047;
    }

    .suggestion-sub {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-empty {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* แถบปุ่มเปิด Pop-up เลือกตัวละคร */
    .select-row {
      position: relative;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .picker-trigger-btn {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .picker-trigger-btn:hover:not(:disabled) {
      border-color: #fde047;
      background-color: var(--surface-soft);
    }

    .picker-trigger-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .picker-trigger-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fde047;
    }

    .picker-trigger-label.is-placeholder {
      color: var(--text);
    }

    .picker-trigger-icon {
      font-size: 0.85rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .clear-btn {
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--surface);
      color: #fca5a5;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .clear-btn:hover:not(:disabled) {
      background-color: #991b1b;
      border-color: #fca5a5;
      color: #ffffff;
    }

    .clear-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* =========================================================
       Pop-up Overlay ลิสต์ตัวละคร:
       - ตำแหน่งอิงใกล้ปุ่มที่กด
       - ขยายใหญ่ขึ้น และแสดงสูงสุดประมาณ 3 ตัวละครต่อหน้า
       - มีปุ่มลูกศรกดเลื่อนขึ้น-ลง
       ========================================================= */
    .char-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.35);
      z-index: 100;
      display: none;
    }

    .char-modal-backdrop.open {
      display: block;
    }

    .char-modal-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: min(600px, calc(100vw - 24px));
      background-color: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 16px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .char-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .char-modal-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .char-modal-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .char-scroll-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: #fde047;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .char-scroll-btn:hover {
      background-color: var(--primary);
      border-color: #fde047;
      color: #ffffff;
    }

    .char-modal-close {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .char-modal-close:hover {
      background-color: #991b1b;
      border-color: #fca5a5;
    }

    /* แสดงสูงสุด 3 ตัวละครต่อความสูงลิสต์ พร้อมเลื่อนขึ้น-ลงได้ */
    .char-modal-list {
      max-height: 294px;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .char-list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 84px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background-color: var(--surface);
      color: #ffffff;
      cursor: pointer;
      text-align: left;
      flex-shrink: 0;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .char-list-item:hover {
      background-color: var(--surface-soft);
      border-color: var(--primary);
    }

    .char-list-item.is-selected {
      background-color: var(--accent);
      border-color: #fde047;
    }

    .char-list-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 3px;
    }

    .char-list-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .char-list-thumb-empty {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
      padding: 2px;
    }

    .char-list-name {
      font-size: 1.06rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      min-width: 0;
      flex: 1;
    }

    .char-list-item.is-selected .char-list-name {
      color: #fde047;
    }

    .char-modal-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* =========================================================
       โหมดแนวนอน (หน้าจอกว้าง): รูปซ้ายสุดใหญ่ + ขวาเป็นหัวข้อและสกิลด้านล่าง
       ========================================================= */
    .char-layout {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .char-top-partition {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    .char-image-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-frame {
      width: 260px;
      height: 260px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .image-placeholder {
      font-size: 0.92rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
      padding: 8px;
    }

    .char-meta-stack {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .char-row-name {
      display: flex;
      align-items: center;
    }

    .char-name-box {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .char-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.35;
    }

    .char-row-costume {
      display: flex;
      align-items: center;
    }

    .costume-control-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .costume-select {
      min-width: 175px;
      max-width: 240px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--costume-border);
      border-radius: 8px;
      background-color: var(--costume-accent);
      color: var(--costume-text);
      cursor: pointer;
    }

    .costume-select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background-color: var(--surface);
      border-color: var(--border);
      color: var(--muted);
    }

    .costume-clear-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--surface);
      color: #fca5a5;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .costume-clear-btn:hover:not(:disabled) {
      background-color: #991b1b;
      border-color: #fca5a5;
      color: #ffffff;
    }

    .costume-clear-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .char-row-variants {
      display: flex;
      align-items: center;
    }

    .variant-tabs {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .variant-btn {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: #ffffff;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }

    .variant-btn:hover:not(:disabled) {
      border-color: #fde047;
    }

    .variant-btn.active[data-variant="evo"] {
      background-color: var(--evo-theme);
      border-color: #bae6fd;
      color: #fff;
    }

    .variant-btn.active[data-variant="legend"] {
      background-color: var(--legend-theme);
      border-color: #fde68a;
      color: #fff;
    }

    .variant-btn.active[data-variant="mystic"] {
      background-color: var(--mystic-theme);
      border-color: #ddd6fe;
      color: #fff;
    }

    .variant-btn.no-data {
      opacity: 0.45;
    }

    .char-skills-partition {
      min-width: 0;
    }

    .empty-variant-box {
      padding: 18px;
      border-radius: 8px;
      background-color: var(--surface);
      border: 1px dashed var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    .costume-section {
      margin-top: 22px;
    }

    .costume-heading {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 8px;
      background-color: var(--costume-accent);
      border: 1px solid var(--costume-border);
      color: var(--costume-text);
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0 0 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
      background-color: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
      font-size: 0.94rem;
      color: #ffffff;
    }

    th {
      background-color: var(--primary-hover);
      color: #ffffff;
      font-weight: 700;
    }

    th.col-desc-hdr {
      text-align: center;
    }

    .col-slot {
      width: 48px;
      text-align: center;
    }

    .col-percent {
      width: 86px;
      text-align: center;
    }

    .col-growth {
      width: 92px;
      text-align: center;
    }

    .percent-badge {
      display: inline-block;
      background-color: rgba(72, 169, 189, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .percent-none {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    .growth-badge {
      display: inline-block;
      background-color: var(--growth-bg);
      border: 1px solid rgba(254, 240, 138, 0.35);
      color: var(--growth-text);
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .growth-empty {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: transparent;
      color: var(--muted);
    }

    .error-box {
      color: #ffffff;
      background-color: #991b1b;
      border: 1px solid #fca5a5;
      padding: 14px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* =========================================================
       โหมดแนวตั้ง (หน้าจอแคบ): แบ่งเป็น 2 Partition
       Partition บน: รูปซ้าย + ขวาเรียง 3 บรรทัด (ชื่อ / คอสตูม / ระดับ)
       Partition ล่าง: ตารางสกิล
       ========================================================= */
    @media (max-width: 700px) {
      body { padding: 12px; }
      .top-header { margin-bottom: 12px; }
      h1 { font-size: 1.25rem; }
      .back-btn { padding: 5px 10px; font-size: 0.8rem; }
      .card { padding: 14px; border-radius: 10px; }
      .loading-panel { padding: 14px 12px; }
      .loading-top { font-size: 0.84rem; }
      .loading-track { height: 11px; }
      .search-wrapper { margin-bottom: 10px; }
      .search-row { gap: 6px; }
      .search-input { padding: 9px 10px; font-size: 0.86rem; }
      .search-btn { padding: 9px 12px; font-size: 0.82rem; }
      .suggestion-name { font-size: 0.84rem; }
      .suggestion-sub { font-size: 0.72rem; }
      .suggestion-empty { font-size: 0.8rem; }
      .select-row { gap: 8px; }
      .picker-trigger-btn { padding: 10px 12px; font-size: 0.88rem; }
      .clear-btn { width: 40px; height: 40px; font-size: 0.95rem; }

      .char-modal-list { max-height: 258px; }
      .char-list-item { min-height: 74px; padding: 8px 10px; gap: 10px; }
      .char-list-thumb { width: 54px; height: 54px; }
      .char-list-name { font-size: 0.95rem; }
      .char-scroll-btn, .char-modal-close { width: 32px; height: 32px; font-size: 0.82rem; }

      .char-layout {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Partition บน: ซ้ายเป็นรูป, ขวาเรียง 3 บรรทัด */
      .char-top-partition {
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .image-frame {
        width: 148px;
        height: 148px;
        border-radius: 12px;
        padding: 6px;
      }

      .image-placeholder {
        font-size: 0.78rem;
      }

      .char-meta-stack {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      /* บรรทัดที่ 1: ชื่อตัวละคร */
      .char-row-name {
        width: 100%;
      }

      .char-name-box {
        width: 100%;
        padding: 7px 11px;
        border-radius: 8px;
      }

      .char-title {
        font-size: 0.92rem;
      }

      /* บรรทัดที่ 2: dropdown คอสตูม */
      .char-row-costume {
        width: 100%;
      }

      .costume-control-group {
        width: 100%;
      }

      .costume-select {
        flex: 1;
        min-width: 0;
        max-width: none;
        padding: 6px 8px;
        font-size: 0.78rem;
      }

      .costume-clear-btn {
        width: 30px;
        height: 30px;
        font-size: 0.84rem;
      }

      /* บรรทัดที่ 3: tab ระดับ */
      .char-row-variants {
        width: 100%;
      }

      .variant-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        width: 100%;
      }

      .variant-btn {
        padding: 6px 4px;
        font-size: 0.74rem;
        text-align: center;
      }

      /* Partition ล่าง: แสดงสกิล */
      .costume-heading { font-size: 0.84rem; padding: 6px 10px; }
      th, td { padding: 8px 4px; font-size: 0.76rem; line-height: 1.42; }
      .col-slot { width: 30px; }
      .col-percent { width: 64px; }
      .col-growth { width: 68px; }
      .percent-badge, .growth-badge { padding: 2px 5px; font-size: 0.68rem; }
      .error-box { padding: 10px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-header">
    <div class="top-header-left">
      <a href="https://leonhartna.github.io/getrich-info/" class="back-btn">← Back</a>
      <h1>ข้อมูลตัวละคร</h1>
    </div>
  </div>

  <div class="card">
    <div id="loadingArea"></div>

    <div id="mainControls" class="is-hidden">
      <div class="search-wrapper" id="searchWrapper">
        <div class="search-row">
          <input
            id="charSearchInput"
            class="search-input"
            type="text"
            placeholder="พิมพ์ชื่อตัวละคร หรือคำในความสามารถ..."
            autocomplete="off"
            oninput="renderSuggestions()"
            onfocus="renderSuggestions()"
            onkeydown="handleSearchKeydown(event)"
          />
          <button
            id="searchBtn"
            class="search-btn"
            type="button"
            onclick="triggerSearch()"
          >Search</button>
        </div>
        <div id="suggestionsBox" class="suggestions-box"></div>
      </div>

      <div class="select-row">
        <input id="charSelect" type="hidden" value="" />
        <button
          id="openCharModalBtn"
          class="picker-trigger-btn"
          type="button"
          onclick="openCharModal()"
          disabled
        >
          <span id="pickerTriggerLabel" class="picker-trigger-label is-placeholder">เลือกตัวละคร</span>
          <span class="picker-trigger-icon">▼</span>
        </button>
        <button
          id="clearSelectionBtn"
          class="clear-btn"
          type="button"
          title="ล้างค่าการเลือก"
          aria-label="ล้างค่าการเลือก"
          onclick="clearSelection()"
          disabled
        >✕</button>
      </div>
    </div>

    <div id="charDetails"></div>
  </div>
</div>

<!-- Pop-up Overlay ลิสต์ตัวละคร -->
<div
  id="charModalBackdrop"
  class="char-modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="charModalTitle"
  onclick="handleModalBackdropClick(event)"
>
  <div id="charModalPanel" class="char-modal-panel" onclick="event.stopPropagation()">
    <div class="char-modal-header">
      <h2 id="charModalTitle" class="char-modal-title">เลือกตัวละคร</h2>
      <div class="char-modal-actions">
        <button
          type="button"
          class="char-scroll-btn"
          title="เลื่อนขึ้น"
          aria-label="เลื่อนขึ้น"
          onclick="scrollCharModalList(-1)"
        >▲</button>
        <button
          type="button"
          class="char-scroll-btn"
          title="เลื่อนลง"
          aria-label="เลื่อนลง"
          onclick="scrollCharModalList(1)"
        >▼</button>
        <button
          type="button"
          class="char-modal-close"
          title="ปิดหน้าต่าง"
          aria-label="ปิดหน้าต่าง"
          onclick="closeCharModal()"
        >✕</button>
      </div>
    </div>
    <div id="charModalList" class="char-modal-list"></div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyF9gONpT93rFZA6vIkyTpOvVQhN2cduwOVcWfpUVSC5SC2vkGkgDzJn8AqK6IuNAlm/exec";
  const VARIANT_ORDER = ["evo", "legend", "mystic"];
  const VARIANT_LABELS = {
    evo: "[อีโว]",
    legend: "[ตำนาน]",
    mystic: "[มิสติก]"
  };

  let charDatabase = [];
  let activeVariant = "evo";
  // 0 = ยังไม่ได้เข้าโหมดมิสติก (แสดง "[มิสติก]")
  // 1 = มิสติก 1 (แสดง "[มิสติก 1]" และตัดสกิลช่องสุดท้ายออก 1 ช่อง)
  // 2 = มิสติก 2 (แสดง "[มิสติก 2]" และแสดงสกิลทั้งหมด)
  let mysticStep = 0;
  let selectedCostumeIndex = "";
  let loadingTimer = null;
  let currentProgress = 0;

  function getMysticButtonLabel() {
    if (mysticStep === 1) return "[มิสติก 1]";
    if (mysticStep === 2) return "[มิสติก 2]";
    return VARIANT_LABELS.mystic;
  }

  function getVariantButtonLabel(vKey) {
    if (vKey === "mystic") {
      return getMysticButtonLabel();
    }
    return VARIANT_LABELS[vKey];
  }

  function getDisplayedVariantSkills(character, variantKey) {
    const rawSkills = getVariantSkills(character, variantKey);
    if (variantKey !== "mystic") {
      return rawSkills;
    }
    if (mysticStep === 1) {
      return rawSkills.length > 1 ? rawSkills.slice(0, -1) : rawSkills;
    }
    return rawSkills;
  }

  function setMainControlsVisible(visible) {
    const mainControls = document.getElementById("mainControls");
    if (!mainControls) return;
    if (visible) {
      mainControls.classList.remove("is-hidden");
    } else {
      mainControls.classList.add("is-hidden");
    }
  }

  function startLoadingBar() {
    const loadingArea = document.getElementById("loadingArea");
    const detailsArea = document.getElementById("charDetails");
    stopLoadingBar();
    currentProgress = 12;
    setMainControlsVisible(false);
    detailsArea.innerHTML = "";

    loadingArea.innerHTML = `
      <div id="loadingPanel" class="loading-panel">
        <div class="loading-top">
          <span id="loadingStatusText">Loading</span>
          <span id="loadingPercentText" class="loading-percent">12%</span>
        </div>
        <div class="loading-track">
          <div id="loadingFillBar" class="loading-fill" style="width: 12%;"></div>
        </div>
      </div>
    `;

    loadingTimer = setInterval(() => {
      if (currentProgress < 90) {
        const step = currentProgress < 50 ? 7 : currentProgress < 75 ? 4 : 2;
        currentProgress = Math.min(90, currentProgress + step);
        updateLoadingBarVisual(currentProgress, "Loading", false);
      }
    }, 220);
  }

  function updateLoadingBarVisual(pct, statusText, isFull) {
    const fill = document.getElementById("loadingFillBar");
    const pctText = document.getElementById("loadingPercentText");
    const labelText = document.getElementById("loadingStatusText");
    if (!fill || !pctText || !labelText) return;

    const clamped = Math.max(0, Math.min(100, Math.round(pct)));
    fill.style.width = `${clamped}%`;
    pctText.textContent = `${clamped}%`;
    if (statusText) labelText.textContent = statusText;
    if (isFull) {
      fill.classList.add("full");
    }
  }

  function finishLoadingBarAndShowControls() {
    stopLoadingBar();
    const loadingArea = document.getElementById("loadingArea");
    const panel = document.getElementById("loadingPanel");

    if (!panel) {
      loadingArea.innerHTML = "";
      setMainControlsVisible(true);
      return Promise.resolve();
    }

    currentProgress = 100;
    updateLoadingBarVisual(100, "Loading", true);

    return new Promise(resolve => {
      setTimeout(() => {
        panel.classList.add("done");
        setTimeout(() => {
          loadingArea.innerHTML = "";
          setMainControlsVisible(true);
          resolve();
        }, 220);
      }, 280);
    });
  }

  function stopLoadingBar() {
    if (loadingTimer) {
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
  }

  function getVariantData(character, variantKey) {
    if (!character || !character.variants || !character.variants[variantKey]) {
      return { image: "", skills: [] };
    }
    const v = character.variants[variantKey];
    return {
      image: String(v.image || "").trim(),
      skills: Array.isArray(v.skills) ? v.skills : []
    };
  }

  function getVariantSkills(character, variantKey) {
    return getVariantData(character, variantKey).skills;
  }

  function getCharacterCostumes(character) {
    if (!character || !Array.isArray(character.costumes)) {
      return [];
    }
    return character.costumes;
  }

  // สร้างลำดับ URL รูปจากเลขลำดับต่ำสุดไปสูงขึ้น (เช่น 01 -> 02 -> 03 หรือ evo -> legend -> mystic)
  function getLowestNumberCandidateImages(character) {
    const candidates = [];
    const seen = new Set();

    function addUrl(url) {
      const clean = String(url || "").trim();
      if (!clean || seen.has(clean)) return;
      seen.add(clean);
      candidates.push(clean);
    }

    function extractGradeRank(url) {
      const numMatch = url.match(/(?:^|[^0-9])(0[1-9]|[1-9][0-9]?)(?:[^0-9]|$)/);
      if (numMatch) {
        return Number(numMatch[1]);
      }
      if (/evo/i.test(url)) return 1;
      if (/legend/i.test(url)) return 2;
      if (/mystic/i.test(url)) return 3;
      return 999;
    }

    const rawEntries = [];
    VARIANT_ORDER.forEach((vKey, idx) => {
      const img = getVariantData(character, vKey).image;
      if (img) {
        rawEntries.push({
          url: img,
          rank: extractGradeRank(img),
          fallbackOrder: idx
        });
      }
    });

    rawEntries.sort((a, b) => {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return a.fallbackOrder - b.fallbackOrder;
    });

    rawEntries.forEach(entry => addUrl(entry.url));
    return candidates;
  }

  function handleThumbImgError(imgEl) {
    const fallbackListJson = imgEl.getAttribute("data-fallbacks") || "[]";
    let fallbacks = [];
    try {
      fallbacks = JSON.parse(fallbackListJson);
    } catch (e) {
      fallbacks = [];
    }

    if (Array.isArray(fallbacks) && fallbacks.length > 0) {
      const nextUrl = fallbacks.shift();
      imgEl.setAttribute("data-fallbacks", JSON.stringify(fallbacks));
      imgEl.src = nextUrl;
      return;
    }

    imgEl.outerHTML = `<span class="char-list-thumb-empty">ไม่มีรูป</span>`;
  }

  function renderCharacterThumbHtml(character) {
    const candidates = getLowestNumberCandidateImages(character);
    if (candidates.length === 0) {
      return `<span class="char-list-thumb-empty">ไม่มีรูป</span>`;
    }
    const primary = candidates[0];
    const rest = candidates.slice(1);
    const encodedRest = escapeHtml(JSON.stringify(rest));
    return `
      <img
        src="${escapeHtml(primary)}"
        alt="${escapeHtml(character.name || "")}"
        data-fallbacks="${encodedRest}"
        loading="lazy"
        onerror="handleThumbImgError(this)"
      />
    `;
  }

  function syncPickerUiState() {
    const select = document.getElementById("charSelect");
    const openBtn = document.getElementById("openCharModalBtn");
    const labelEl = document.getElementById("pickerTriggerLabel");
    const clearBtn = document.getElementById("clearSelectionBtn");

    const hasChars = charDatabase.length > 0;
    openBtn.disabled = !hasChars;

    if (!hasChars) {
      labelEl.textContent = "ไม่พบข้อมูลตัวละคร";
      labelEl.classList.add("is-placeholder");
      clearBtn.disabled = true;
      return;
    }

    const currentId = select.value;
    const found = currentId ? charDatabase.find(c => c.id === currentId) : null;

    if (found) {
      labelEl.textContent = found.name;
      labelEl.classList.remove("is-placeholder");
      clearBtn.disabled = false;
    } else {
      labelEl.textContent = "เลือกตัวละคร";
      labelEl.classList.add("is-placeholder");
      clearBtn.disabled = true;
    }
  }

  function positionCharModalNearButton() {
    const btn = document.getElementById("openCharModalBtn");
    const panel = document.getElementById("charModalPanel");
    if (!btn || !panel) return;

    const margin = 12;
    const gap = 6;
    const btnRect = btn.getBoundingClientRect();
    const panelRect = panel.getBoundingClientRect();
    const panelWidth = panelRect.width || Math.min(600, window.innerWidth - margin * 2);
    const panelHeight = panelRect.height || 360;

    let left = btnRect.left;
    if (left + panelWidth > window.innerWidth - margin) {
      left = window.innerWidth - panelWidth - margin;
    }
    if (left < margin) {
      left = margin;
    }

    let top = btnRect.bottom + gap;
    if (top + panelHeight > window.innerHeight - margin) {
      const aboveTop = btnRect.top - panelHeight - gap;
      if (aboveTop >= margin) {
        top = aboveTop;
      } else {
        top = Math.max(margin, window.innerHeight - panelHeight - margin);
      }
    }

    panel.style.left = `${Math.round(left)}px`;
    panel.style.top = `${Math.round(top)}px`;
  }

  function scrollCharModalList(direction) {
    const listEl = document.getElementById("charModalList");
    if (!listEl) return;
    const step = Math.max(88, Math.round(listEl.clientHeight * 0.85));
    listEl.scrollBy({
      top: direction * step,
      behavior: "smooth"
    });
  }

  function renderCharModalList() {
    const listEl = document.getElementById("charModalList");
    const currentId = document.getElementById("charSelect").value;

    if (!Array.isArray(charDatabase) || charDatabase.length === 0) {
      listEl.innerHTML = `<div class="char-modal-empty">ไม่พบข้อมูลตัวละคร</div>`;
      return;
    }

    listEl.innerHTML = charDatabase
      .map(item => {
        const isSelected = item.id === currentId;
        return `
          <button
            type="button"
            class="char-list-item ${isSelected ? "is-selected" : ""}"
            onclick="selectCharFromModal('${escapeJsAttr(item.id)}')"
          >
            <span class="char-list-thumb">${renderCharacterThumbHtml(item)}</span>
            <span class="char-list-name">${escapeHtml(item.name)}</span>
          </button>
        `;
      })
      .join("");
  }

  function openCharModal() {
    if (charDatabase.length === 0) return;
    renderCharModalList();
    const backdrop = document.getElementById("charModalBackdrop");
    backdrop.classList.add("open");
    requestAnimationFrame(() => {
      positionCharModalNearButton();
    });
  }

  function closeCharModal() {
    const backdrop = document.getElementById("charModalBackdrop");
    backdrop.classList.remove("open");
  }

  function handleModalBackdropClick(event) {
    if (event.target && event.target.id === "charModalBackdrop") {
      closeCharModal();
    }
  }

  window.addEventListener("resize", function () {
    const backdrop = document.getElementById("charModalBackdrop");
    if (backdrop && backdrop.classList.contains("open")) {
      positionCharModalNearButton();
    }
  });

  window.addEventListener("scroll", function () {
    const backdrop = document.getElementById("charModalBackdrop");
    if (backdrop && backdrop.classList.contains("open")) {
      positionCharModalNearButton();
    }
  }, { passive: true });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      const backdrop = document.getElementById("charModalBackdrop");
      if (backdrop && backdrop.classList.contains("open")) {
        closeCharModal();
      }
      hideSuggestions();
    }
  });

  function selectCharFromModal(charId) {
    const select = document.getElementById("charSelect");
    const input = document.getElementById("charSearchInput");
    const character = charDatabase.find(c => c.id === charId);
    if (!character) return;

    select.value = character.id;
    input.value = character.name;
    selectedCostumeIndex = "";
    mysticStep = 0;

    const currentSkills = getVariantSkills(character, activeVariant);
    if (currentSkills.length === 0) {
      const firstAvailable = VARIANT_ORDER.find(v => getVariantSkills(character, v).length > 0);
      if (firstAvailable) {
        activeVariant = firstAvailable;
      }
    }
    if (activeVariant === "mystic") {
      mysticStep = 1;
    }

    closeCharModal();
    renderSelectedCharacter();
  }

  function handleImgError(imgEl) {
    imgEl.outerHTML = `<span class="image-placeholder">ไม่มีรูป</span>`;
  }

  function formatGrowthValue(growth) {
    if (growth === null || growth === undefined) {
      return { text: "-", isEmpty: true };
    }

    if (typeof growth === "number") {
      if (isNaN(growth)) return { text: "-", isEmpty: true };
      if (Math.abs(growth) > 0 && Math.abs(growth) < 1) {
        const pct = Math.round(growth * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${growth > 0 ? "+" : ""}${growth}`, isEmpty: false };
    }

    const str = String(growth).trim();
    if (!str || str === "-") {
      return { text: "-", isEmpty: true };
    }

    if (/^[+-]?\d+(\.\d+)?$/.test(str)) {
      const num = Number(str);
      if (Math.abs(num) > 0 && Math.abs(num) < 1) {
        const pct = Math.round(num * 10000) / 100;
        return { text: `${pct > 0 ? "+" : ""}${pct}%`, isEmpty: false };
      }
      return { text: `${num > 0 ? "+" : ""}${num}`, isEmpty: false };
    }

    return { text: str, isEmpty: false };
  }

  function hideSuggestions() {
    const box = document.getElementById("suggestionsBox");
    box.classList.remove("show");
  }

  function findMatchingCharacters(keyword) {
    const q = keyword.trim().toLowerCase();
    if (!q) return [];

    return charDatabase
      .map(item => {
        const nameMatch = (item.name || "").toLowerCase().includes(q);
        let matchedVariant = null;
        let matchedSkillDesc = "";
        let matchedCostumeIdx = "";

        for (const vKey of VARIANT_ORDER) {
          const skills = getVariantSkills(item, vKey);
          const found = skills.find(s =>
            (s.desc || "").toLowerCase().includes(q) ||
            String(s.growth || "").toLowerCase().includes(q) ||
            String(s.percent || "").toLowerCase().includes(q)
          );
          if (found) {
            matchedVariant = vKey;
            matchedSkillDesc = found.desc;
            break;
          }
        }

        if (!matchedVariant) {
          const costumes = getCharacterCostumes(item);
          const cIdx = costumes.findIndex(c =>
            (c.costumeName || "").toLowerCase().includes(q) ||
            (c.desc || "").toLowerCase().includes(q) ||
            String(c.percent || "").toLowerCase().includes(q)
          );
          if (cIdx !== -1) {
            matchedCostumeIdx = String(cIdx);
            matchedSkillDesc = `[คอสตูม ${costumes[cIdx].costumeName}] ${costumes[cIdx].desc}`;
          }
        }

        if (!nameMatch && !matchedVariant && matchedCostumeIdx === "") return null;

        if (!matchedVariant) {
          for (const vKey of VARIANT_ORDER) {
            const skills = getVariantSkills(item, vKey);
            if (skills.length > 0) {
              matchedVariant = vKey;
              if (!matchedSkillDesc) matchedSkillDesc = skills[0].desc;
              break;
            }
          }
        }

        return {
          character: item,
          suggestedVariant: matchedVariant || "evo",
          suggestedCostumeIdx: matchedCostumeIdx,
          previewText: matchedSkillDesc
        };
      })
      .filter(Boolean);
  }

  function renderSuggestions() {
    const input = document.getElementById("charSearchInput");
    const box = document.getElementById("suggestionsBox");

    if (charDatabase.length === 0) {
      hideSuggestions();
      return;
    }

    const q = input.value.trim();
    if (!q) {
      hideSuggestions();
      return;
    }

    const matches = findMatchingCharacters(q);

    if (matches.length === 0) {
      box.innerHTML = `<div class="suggestion-empty">ไม่พบตัวละครที่ตรงกับ "${escapeHtml(q)}"</div>`;
      box.classList.add("show");
      return;
    }

    box.innerHTML = matches
      .map(m => {
        const vLabel = VARIANT_LABELS[m.suggestedVariant] || "[อีโว]";
        const subText = m.previewText ? `${vLabel} ${m.previewText}` : `ระดับ ${vLabel}`;
        return `
          <div class="suggestion-item" onclick="selectCharFromSuggestion('${escapeJsAttr(m.character.id)}', '${escapeJsAttr(m.character.name)}', '${escapeJsAttr(m.suggestedVariant)}', '${escapeJsAttr(m.suggestedCostumeIdx)}')">
            <span class="suggestion-name">${escapeHtml(m.character.name)}</span>
            <span class="suggestion-sub">${escapeHtml(subText)}</span>
          </div>
        `;
      })
      .join("");

    box.classList.add("show");
  }

  function selectCharFromSuggestion(id, name, variantKey, costumeIdx = "") {
    const select = document.getElementById("charSelect");
    const input = document.getElementById("charSearchInput");
    select.value = id;
    input.value = name;
    const nextVariant = VARIANT_ORDER.includes(variantKey) ? variantKey : "evo";
    activeVariant = nextVariant;
    mysticStep = nextVariant === "mystic" ? 1 : 0;
    selectedCostumeIndex = costumeIdx !== undefined ? String(costumeIdx) : "";
    hideSuggestions();
    renderSelectedCharacter();
  }

  function triggerSearch() {
    const input = document.getElementById("charSearchInput");
    const select = document.getElementById("charSelect");
    const matches = findMatchingCharacters(input.value);

    if (matches.length > 0) {
      const nextVariant = matches[0].suggestedVariant || "evo";
      select.value = matches[0].character.id;
      activeVariant = nextVariant;
      mysticStep = nextVariant === "mystic" ? 1 : 0;
      selectedCostumeIndex = matches[0].suggestedCostumeIdx || "";
      hideSuggestions();
      renderSelectedCharacter();
    } else {
      renderSuggestions();
    }
  }

  function handleSearchKeydown(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      triggerSearch();
    } else if (event.key === "Escape") {
      hideSuggestions();
    }
  }

  document.addEventListener("click", function (event) {
    const wrapper = document.getElementById("searchWrapper");
    if (wrapper && !wrapper.contains(event.target)) {
      hideSuggestions();
    }
  });

  function clearSelection() {
    const select = document.getElementById("charSelect");
    const input = document.getElementById("charSearchInput");
    if (charDatabase.length === 0) return;
    select.value = "";
    input.value = "";
    activeVariant = "evo";
    mysticStep = 0;
    selectedCostumeIndex = "";
    hideSuggestions();
    renderSelectedCharacter();
  }

  function handleCostumeChange(value) {
    selectedCostumeIndex = value;
    renderSelectedCharacter();
  }

  function clearCostumeSelection() {
    selectedCostumeIndex = "";
    renderSelectedCharacter();
  }

  function selectVariant(variantKey) {
    if (!VARIANT_ORDER.includes(variantKey)) return;

    if (variantKey === "mystic") {
      if (activeVariant !== "mystic" || mysticStep === 0) {
        activeVariant = "mystic";
        mysticStep = 1;
      } else if (mysticStep === 1) {
        mysticStep = 2;
      } else {
        mysticStep = 1;
      }
    } else {
      activeVariant = variantKey;
      mysticStep = 0;
    }

    renderSelectedCharacter();
  }

  function fetchJsonp(url, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const callbackName = "handleCharJsonp_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("หมดเวลาในการเชื่อมต่อ Web App"));
      }, timeoutMs);

      function cleanup() {
        clearTimeout(timer);
        delete window[callbackName];
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function (data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function () {
        cleanup();
        reject(new Error("ไม่สามารถโหลดสคริปต์จาก Web App ได้"));
      };

      const separator = url.includes("?") ? "&" : "?";
      script.src = `${url}${separator}callback=${encodeURIComponent(callbackName)}`;
      document.body.appendChild(script);
    });
  }

  async function loadCharactersFromSheet() {
    const select = document.getElementById("charSelect");
    const loadingArea = document.getElementById("loadingArea");
    const container = document.getElementById("charDetails");

    startLoadingBar();

    try {
      let json = null;

      try {
        const response = await fetch(WEB_APP_URL);
        const rawText = await response.text();
        json = JSON.parse(rawText);
      } catch (fetchErr) {
        json = await fetchJsonp(WEB_APP_URL);
      }

      if (!json || !json.ok || !Array.isArray(json.data)) {
        throw new Error((json && json.error) || "รูปแบบข้อมูลจาก Web App ไม่ถูกต้อง");
      }

      charDatabase = json.data;
      select.value = "";

      await finishLoadingBarAndShowControls();
      syncPickerUiState();
      renderSelectedCharacter();
    } catch (error) {
      stopLoadingBar();
      loadingArea.innerHTML = "";
      setMainControlsVisible(false);
      container.innerHTML = `
        <div class="error-box">
          <strong>เกิดข้อผิดพลาดในการดึงข้อมูล:</strong><br/>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function renderSkillRows(skillsList) {
    return skillsList
      .map((skill, index) => {
        const percentStr = String(skill.percent || "ไม่ระบุเปอร์เซ็นต์");
        const isNoPercent = percentStr === "ไม่ระบุเปอร์เซ็นต์";
        const growthInfo = formatGrowthValue(skill.growth);

        return `
          <tr>
            <td class="col-slot">${index + 1}</td>
            <td>${escapeHtml(skill.desc)}</td>
            <td class="col-percent">
              <span class="percent-badge ${isNoPercent ? 'percent-none' : ''}">
                ${escapeHtml(percentStr)}
              </span>
            </td>
            <td class="col-growth">
              <span class="growth-badge ${growthInfo.isEmpty ? 'growth-empty' : ''}">
                ${escapeHtml(growthInfo.text)}
              </span>
            </td>
          </tr>
        `;
      })
      .join("");
  }

  function renderSkillTable(skillsList) {
    return `
      <table>
        <thead>
          <tr>
            <th class="col-slot">ช่อง</th>
            <th class="col-desc-hdr">ความสามารถ</th>
            <th class="col-percent">%</th>
            <th class="col-growth">เติบโต</th>
          </tr>
        </thead>
        <tbody>${renderSkillRows(skillsList)}</tbody>
      </table>
    `;
  }

  function renderSelectedCharacter() {
    const selectedId = document.getElementById("charSelect").value;
    const container = document.getElementById("charDetails");

    syncPickerUiState();

    if (!selectedId) {
      container.innerHTML = "";
      return;
    }

    const character = charDatabase.find(c => c.id === selectedId);
    if (!character) {
      container.innerHTML = "";
      return;
    }

    const variantData = getVariantData(character, activeVariant);
    const currentSkills = getDisplayedVariantSkills(character, activeVariant);
    const imageUrl = variantData.image;
    const costumes = getCharacterCostumes(character);

    const validIndex =
      selectedCostumeIndex !== "" &&
      Number(selectedCostumeIndex) >= 0 &&
      Number(selectedCostumeIndex) < costumes.length
        ? String(Number(selectedCostumeIndex))
        : "";
    selectedCostumeIndex = validIndex;

    const selectedCostume = validIndex !== "" ? costumes[Number(validIndex)] : null;

    const imageContentHtml = imageUrl
      ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(character.name)} ${escapeHtml(getVariantButtonLabel(activeVariant))}" onerror="handleImgError(this)" />`
      : `<span class="image-placeholder">ไม่มีรูป</span>`;

    const costumePlaceholderText = costumes.length === 0 ? "ไม่มีคอสตูม" : "คอสตูม";
    const costumeOptionsHtml =
      `<option value="">${escapeHtml(costumePlaceholderText)}</option>` +
      costumes
        .map((c, idx) => `<option value="${idx}" ${validIndex === String(idx) ? "selected" : ""}>${escapeHtml(c.costumeName)}</option>`)
        .join("");

    const costumeGroupHtml = `
      <div class="costume-control-group">
        <select
          id="costumeSelect"
          class="costume-select"
          onchange="handleCostumeChange(this.value)"
          ${costumes.length === 0 ? "disabled" : ""}
        >${costumeOptionsHtml}</select>
        <button
          type="button"
          class="costume-clear-btn"
          title="ยกเลิกการเลือกคอสตูม"
          aria-label="ยกเลิกการเลือกคอสตูม"
          onclick="clearCostumeSelection()"
          ${validIndex === "" ? "disabled" : ""}
        >✕</button>
      </div>
    `;

    const tabsHtml = VARIANT_ORDER.map(vKey => {
      const rawSkills = getVariantSkills(character, vKey);
      const isActive = activeVariant === vKey;
      const hasData = rawSkills.length > 0;
      const btnLabel = getVariantButtonLabel(vKey);
      return `
        <button
          type="button"
          class="variant-btn ${isActive ? "active" : ""} ${!hasData ? "no-data" : ""}"
          data-variant="${vKey}"
          onclick="selectVariant('${vKey}')"
        >${escapeHtml(btnLabel)}</button>
      `;
    }).join("");

    const activeLabelText = getVariantButtonLabel(activeVariant);

    const mainTableHtml =
      currentSkills.length === 0
        ? `
          <div class="empty-variant-box">
            ไม่มีข้อมูลความสามารถสำหรับระดับ <strong>${escapeHtml(activeLabelText)}</strong>
          </div>
        `
        : renderSkillTable(currentSkills);

    const costumeSectionHtml = selectedCostume
      ? `
        <div class="costume-section">
          <h3 class="costume-heading">คอสตูม${escapeHtml(selectedCostume.costumeName)}</h3>
          ${renderSkillTable([selectedCostume])}
        </div>
      `
      : "";

    container.innerHTML = `
      <div class="char-layout">
        <div class="char-top-partition">
          <div class="char-image-box">
            <div class="image-frame">${imageContentHtml}</div>
          </div>
          <div class="char-meta-stack">
            <div class="char-row-name">
              <div class="char-name-box">
                <h2 class="char-title">${escapeHtml(character.name)}</h2>
              </div>
            </div>
            <div class="char-row-costume">
              ${costumeGroupHtml}
            </div>
            <div class="char-row-variants">
              <div class="variant-tabs">${tabsHtml}</div>
            </div>
          </div>
        </div>
        <div class="char-skills-partition">
          ${mainTableHtml}
          ${costumeSectionHtml}
        </div>
      </div>
    `;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeJsAttr(text) {
    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  loadCharactersFromSheet();
</script>

</body>
</html>
