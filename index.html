<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetRich•info</title>
  <style>
    :root {
      --primary: #34546c;
      --primary-hover: #284256;
      --bg: #2c4a5e;
      --card: #48a9bd;
      --card-soft: #54b4c7;
      --card-header: #3897ab;
      --panel-dark: #34546c;
      --panel-darker: #284256;
      --text: #ffffff;
      --muted: #dbeafe;
      --border: rgba(255, 255, 255, 0.28);
      --highlight: #fde047;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
    }

    .nav-wrapper {
      max-width: 1120px;
      margin: 0 auto 18px;
    }

    .getrich-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background-color: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
    }

    .getrich-brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.3px;
      padding: 4px 8px;
    }

    .getrich-brand span {
      color: var(--highlight);
    }

    .getrich-nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .getrich-nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--panel-darker);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .getrich-nav-link:hover {
      background-color: var(--card);
      border-color: rgba(255, 255, 255, 0.55);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .getrich-nav-link.active {
      background-color: var(--card-soft);
      border-color: var(--highlight);
      color: var(--highlight);
      box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.18);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .getrich-nav {
        padding: 10px;
        gap: 8px;
      }

      .getrich-brand {
        font-size: 1.05rem;
        padding: 2px 4px;
      }

      .getrich-nav-links {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .getrich-nav-link {
        padding: 8px 6px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

  <!-- วางบล็อกนี้ไว้ด้านบนสุดของหน้าเว็บ -->
  <div id="getrichNavContainer" class="nav-wrapper"></div>

  <script>
    (function () {
      document.title = "GetRich•info";

      const NAV_ITEMS = [
        { label: "ตัวละคร", href: "https://leonhartna.github.io/getrich-info/character.html" },
        { label: "จี้เครื่องราง", href: "https://leonhartna.github.io/getrich-info/pendant.html" },
        { label: "จัด Set", href: "https://leonhartna.github.io/getrich-info/set.html" }
      ];

      function renderGetRichNav(targetId = "getrichNavContainer") {
        const container = document.getElementById(targetId);
        if (!container) return;

        const currentPath = (window.location.pathname || "").toLowerCase();

        const linksHtml = NAV_ITEMS.map((item) => {
          const itemFileName = item.href.split("/").pop().toLowerCase();
          const isActive =
            currentPath.endsWith("/" + itemFileName) ||
            currentPath.endsWith(itemFileName) ||
            window.location.href.toLowerCase().startsWith(item.href.toLowerCase());

          return `
            <a
              href="${item.href}"
              class="getrich-nav-link${isActive ? " active" : ""}"
              ${isActive ? 'aria-current="page"' : ""}
            >${item.label}</a>
          `;
        }).join("");

        container.innerHTML = `
          <nav class="getrich-nav" aria-label="เมนูหลัก GetRich•info">
            <a href="https://leonhartna.github.io/getrich-info/set.html" class="getrich-brand">
              GetRich<span>•</span>info
            </a>
            <div class="getrich-nav-links">
              ${linksHtml}
            </div>
          </nav>
        `;
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => renderGetRichNav());
      } else {
        renderGetRichNav();
      }
    })();
  </script>

</body>
</html>
